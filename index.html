<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Samarkand Trail</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Gaegu:wght@700&family=Silkscreen&display=swap">
<style>
/* One committed look: a riso-printed handheld. Paper, navy ink, pink/blue/yellow plus Timurid turquoise. */
:root{
  --paper:#FFF8EF;
  --card:#FFFFFF;
  --navy:#26275F;
  --ink2:#5F5B8C;
  --pink:#FF4FA3;
  --pink2:#FFD3E8;
  --blue:#1F7FD0;
  --blue2:#CDEBFF;
  --yellow:#FFE14A;
  --turq:#0FA899;
  --turq2:#C4F3EA;
  --coral:#EE3D63;
  --lav:#E3DBFF;
  --display:"Bagel Fat One","Arial Black",system-ui,sans-serif;
  --hand:Gaegu,"Comic Sans MS","Chalkboard SE",cursive;
  --pix:Silkscreen,"Courier New",monospace;
  color-scheme:light;
}
html,body{min-height:100%}
body{margin:0;background-color:var(--paper);background-image:radial-gradient(rgba(255,79,163,.14) 1.1px,transparent 1.6px);background-size:12px 12px;color:var(--navy);font-family:var(--hand);font-weight:700;font-size:20px;line-height:1.25;-webkit-text-size-adjust:100%}
#app{box-sizing:border-box;max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;gap:14px;padding-block:12px 44px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen{position:relative;border:3px solid var(--navy);border-radius:12px;overflow:hidden;background:#BFE4FF;box-shadow:5px 5px 0 var(--pink)}
#scene{display:block;width:100%;height:auto;aspect-ratio:4/3;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;-webkit-user-select:none;user-select:none}
.tog{position:absolute;top:6px;right:6px;display:flex;gap:6px;z-index:2}
.tog button{width:34px;height:34px;display:grid;place-items:center;padding:0;border-radius:50%;border:2px solid var(--navy);background:var(--card);color:var(--navy);box-shadow:2px 2px 0 var(--navy);cursor:pointer;touch-action:manipulation}
.tog button svg{width:18px;height:18px;display:block}
.tog button[aria-pressed="false"]{background:var(--lav);color:var(--ink2)}
.tog button[aria-pressed="true"] .x{display:none}
.hint{position:absolute;top:50px;right:8px;z-index:2;background:var(--yellow);color:var(--navy);border:2px solid var(--navy);border-radius:10px;padding:4px 9px;font-family:var(--pix);font-size:11px;line-height:1.3;box-shadow:2px 2px 0 var(--navy);pointer-events:none;animation:bob 1.6s ease-in-out infinite}
.hint::before{content:"";position:absolute;top:-8px;right:22px;border:7px solid transparent;border-top:0;border-bottom:8px solid var(--navy)}
.hint::after{content:"";position:absolute;top:-5px;right:24px;border:5px solid transparent;border-top:0;border-bottom:6px solid var(--yellow)}
@keyframes bob{50%{transform:translateY(3px)}}
#hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:2px 12px;padding:6px 12px 7px;background:var(--navy);color:#fff;font-family:var(--pix);font-size:12px;letter-spacing:.02em;font-variant-numeric:tabular-nums;border-top:3px solid var(--navy)}
#hud b{color:var(--yellow);font-weight:400}
#hud .good{color:#7FF0DF}
#hud .warn{color:#FFA3CB}
#text{min-height:3em;overflow-wrap:anywhere}
#text p{margin:0 0 .55em}
#text h1{font-family:var(--display);font-weight:400;font-size:clamp(38px,10.5vw,56px);line-height:.92;margin:.08em 0 .22em;color:var(--pink);text-shadow:-3px -2px 0 rgba(31,127,208,.85);text-wrap:balance}
#text h2{font-family:var(--display);font-weight:400;font-size:26px;line-height:1;margin:.1em 0 .4em;color:var(--pink);text-shadow:-2px -1.5px 0 rgba(31,127,208,.75);text-wrap:balance}
#text h3{font-family:var(--display);font-weight:400;font-size:19px;margin:.6em 0 .3em;color:var(--blue)}
.eyebrow,.date{font-family:var(--pix);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);margin:0 0 .45em!important}
.date{color:var(--ink2);letter-spacing:.03em}
.dim{color:var(--ink2)}
.big{font-size:23px;line-height:1.18}
.warn{color:var(--coral)}
.good{color:var(--turq)}
.small{font-size:17px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tc{visibility:hidden}
.tc.on{visibility:visible}
.anim{animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
#choices{display:flex;flex-direction:column;gap:9px;transition:opacity .3s}
#choices.wait{opacity:0;pointer-events:none}
#choices button{font:inherit;font-size:20px;line-height:1.12;text-align:left;color:var(--navy);background:var(--card);border:2.5px solid var(--navy);border-radius:14px;padding:8px 13px;cursor:pointer;display:flex;gap:11px;align-items:center;box-shadow:3px 3px 0 var(--navy);transition:transform .08s,box-shadow .08s;touch-action:manipulation}
#choices button .k{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--yellow);border:2px solid var(--navy);font-family:var(--pix);font-size:13px;color:var(--navy)}
#choices button .lb{min-width:0}
#choices button .sub{display:block;font-size:16px;color:var(--ink2);margin-top:2px}
#choices button:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--navy)}
#choices button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--navy)}
#choices button.primary{background:var(--pink);color:#fff}
#choices button.primary .sub{color:#FFE3F0}
#choices button.primary .k{background:#fff}
#choices.one button{justify-content:center;text-align:center;border-radius:999px;font-family:var(--display);font-weight:400;font-size:22px;padding:9px 20px;box-shadow:4px 4px 0 var(--navy)}
#choices button[disabled]{opacity:.5;cursor:not-allowed;box-shadow:none;transform:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
input.txt{box-sizing:border-box;width:100%;font:inherit;font-size:22px;background:var(--card);color:var(--navy);border:2.5px solid var(--navy);border-radius:12px;padding:6px 12px;margin:2px 0;box-shadow:3px 3px 0 var(--blue2)}
input.txt::placeholder{color:#A9A4CC}
.nrow{display:flex;align-items:center;gap:10px}
.face{width:42px;height:39px;flex:none;image-rendering:pixelated;image-rendering:crisp-edges;background:var(--blue2);border:2px solid var(--navy);border-radius:10px}
.status{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;margin:0;padding:10px 13px;background:var(--card);border:2.5px solid var(--navy);border-radius:14px;box-shadow:3px 3px 0 var(--turq);font-size:19px;font-variant-numeric:tabular-nums}
.status dt{font-family:var(--pix);font-size:11px;letter-spacing:.03em;text-transform:uppercase;color:var(--ink2);padding-top:5px}
.status dd{margin:0}
.prog{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin-top:6px!important;font-family:var(--pix);font-size:10px;text-transform:uppercase;color:var(--ink2)}
.prog .bar{flex:1;height:11px;border:2px solid var(--navy);border-radius:999px;background:var(--pink2);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--pink)}
.strip{grid-column:1/-1;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:4px 0 6px!important}
.pm{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.pm img{width:34px;height:31px;image-rendering:pixelated;image-rendering:crisp-edges;background:var(--blue2);border:2px solid var(--navy);border-radius:9px}
.pm.dead img{background:var(--lav);opacity:.75}
.pm span{font-family:var(--pix);font-size:9px;color:var(--ink2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hp{width:100%;max-width:46px;height:7px;border:1.5px solid var(--navy);border-radius:99px;background:var(--pink2);overflow:hidden}
.hp i{display:block;height:100%;background:var(--turq)}
.hp i.mid{background:var(--yellow)}
.hp i.low{background:var(--coral)}
.say{position:relative;background:var(--card);border:2.5px solid var(--navy);border-radius:20px 24px 22px 18px/18px 22px 20px 24px;padding:9px 15px 11px;margin:12px 0 11px;box-shadow:4px 4px 0 var(--turq)}
.say::before{content:"";position:absolute;left:34px;top:-15px;width:20px;height:15px;background:var(--navy);clip-path:polygon(0 100%,30% 0,100% 100%)}
.say::after{content:"";position:absolute;left:38px;top:-9px;width:13px;height:10px;background:var(--card);clip-path:polygon(0 100%,30% 0,100% 100%)}
.say .nm{display:inline-block;font-family:var(--pix);font-size:11px;letter-spacing:.03em;text-transform:uppercase;background:var(--yellow);border:2px solid var(--navy);border-radius:999px;padding:1px 10px;margin:0 0 6px}
.say p{margin:0!important;font-size:21px;line-height:1.22;min-height:1.2em}
.say .rest{visibility:hidden}
.tabs{display:flex;flex-wrap:wrap;gap:7px;margin:.1em 0 .8em}
.tabs button{font-family:var(--pix);font-size:11px;letter-spacing:.03em;text-transform:uppercase;color:var(--navy);background:var(--card);border:2px solid var(--navy);border-radius:999px;padding:5px 12px;cursor:pointer;box-shadow:2px 2px 0 var(--navy)}
.tabs button[aria-selected="true"]{background:var(--blue);color:#fff}
.panel{background:var(--card);border:2.5px solid var(--navy);border-radius:14px;padding:11px 14px;margin:0 0 .8em;box-shadow:3px 3px 0 var(--blue2)}
.panel p:last-child{margin-bottom:0!important}
.verse{margin:.75em 0 0;padding:.45em .8em .5em;border-left:4px solid #FF4FA3;background:#FFF0F7;border-radius:4px 12px 12px 4px}.verse p{margin:0 0 .3em!important;font-size:19px;line-height:1.25;color:#26275F}.verse span.at{font-family:var(--pix);font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--blue)}
.store{display:flex;flex-direction:column;gap:9px;margin:.3em 0 .7em}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:8px 11px;background:var(--card);border:2.5px solid var(--navy);border-radius:14px}
.item .nm{font-size:21px;line-height:1.05;min-width:0}
.item .pr{display:inline-block;margin-top:4px;font-family:var(--pix);font-size:10px;background:var(--yellow);border:1.5px solid var(--navy);border-radius:999px;padding:1px 8px}
.item .pr.sell{background:var(--turq2)}
.item .adv{grid-column:1/-1;color:var(--ink2);font-size:16px;line-height:1.15;margin-top:5px}
.step{display:flex;align-items:center;gap:5px}
.step button{font-family:var(--display);font-size:20px;line-height:1;min-width:36px;height:36px;border-radius:999px;background:var(--turq2);color:var(--navy);border:2px solid var(--navy);box-shadow:2px 2px 0 var(--navy);cursor:pointer;padding:0 8px;touch-action:manipulation}
.step button.txtb{font-family:var(--pix);font-size:11px}
.step button:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--navy)}
.step button[disabled]{opacity:.45;box-shadow:none}
.step input{box-sizing:border-box;width:58px;height:36px;border-radius:10px;font-family:var(--pix);font-size:14px;text-align:center;background:var(--paper);color:var(--navy);border:2px solid var(--navy);-moz-appearance:textfield;appearance:textfield}
.step input::-webkit-inner-spin-button,.step input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.bill{display:flex;justify-content:space-between;gap:10px;font-size:22px;padding:6px 4px;border-top:2.5px dashed var(--pink);font-variant-numeric:tabular-nums}
.bill+.bill{border-top:none;padding-top:0}
.map svg{box-sizing:border-box;display:block;width:100%;height:auto;background:#FFF1DE;border:2.5px solid var(--navy);border-radius:14px;box-shadow:3px 3px 0 var(--blue2)}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:17px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:20px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px;background:var(--pink)}
.legend i.todo{background:repeating-linear-gradient(90deg,#8E89B8 0 4px,transparent 4px 7px)}
.legend b{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--yellow);border:2px solid var(--navy);vertical-align:-1px;margin-right:6px}
table.score{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:19px}
table.score td{padding:4px 0;border-bottom:2px dashed var(--pink2)}
table.score td:last-child{text-align:right;color:var(--blue);white-space:nowrap;padding-left:10px;font-family:var(--pix);font-size:13px}
table.score tr.total td{border-bottom:none;font-family:var(--display);font-weight:400;font-size:26px;padding-top:8px;color:var(--pink)}
table.score tr.hl td{background:var(--yellow)}
table.score .rk{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--turq2);border:2px solid var(--navy);font-family:var(--pix);font-size:11px;margin-right:8px;vertical-align:1px}
.roster{display:flex;flex-direction:column;gap:8px}
.mem{display:flex;align-items:center;gap:10px;padding:6px 10px 6px 6px;background:var(--card);border:2px solid var(--navy);border-radius:14px}
.mem .face{border:none;width:46px;height:43px;border-radius:9px}
.mem .n{flex:1;min-width:0;line-height:1.08}
.mem .n small{display:block;font-size:16px;color:var(--ink2)}
.mem .n .bio{display:block;font-size:16px;color:var(--navy);margin-top:3px;line-height:1.15}
.hearts{color:var(--pink);font-size:16px;white-space:nowrap;letter-spacing:1px;align-self:flex-start;margin-top:4px}
.hearts .o{color:var(--pink2)}
.mem.dead{background:var(--lav)}
.crew{display:flex;gap:11px;align-items:flex-start;padding:10px 12px 10px 10px;background:var(--card);border:2.5px solid var(--navy);border-radius:16px;box-shadow:3px 3px 0 var(--pink2)}
.crew .face{width:62px;height:58px}
.crew .who{flex:1;min-width:0}
.crew .who b{font-family:var(--display);font-weight:400;font-size:21px;color:var(--pink);display:block;line-height:1}
.crew .who .org{font-family:var(--pix);font-size:10px;color:var(--blue);text-transform:uppercase;letter-spacing:.03em;display:block;margin:3px 0 4px}
.crew .who p{margin:0 0 .3em!important;font-size:17px;line-height:1.18}
.skill{display:inline-block;font-family:var(--pix);font-size:10px;background:var(--turq2);border:1.5px solid var(--navy);border-radius:999px;padding:1px 8px}
.crews{display:flex;flex-direction:column;gap:9px;margin:.2em 0 .8em}
.cards{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;padding:11px 13px;background:var(--card);border:2.5px solid var(--navy);border-radius:14px;margin:0 0 .8em;font-size:19px}
.cards dt{font-family:var(--pix);font-size:11px;letter-spacing:.03em;text-transform:uppercase;color:var(--ink2);padding-top:5px}
.cards dd{margin:0}
.wonders{display:flex;flex-direction:column;gap:6px;margin:0 0 .8em}
.wonder{padding:7px 12px;background:#FFFBEA;border:2px solid var(--navy);border-radius:12px;font-size:18px}
.wonder b{color:var(--pink)}
.tomb{box-sizing:border-box;margin:.5em auto .9em;max-width:290px;text-align:center;background:#EDE8FF;border:3px solid var(--navy);border-radius:140px 140px 14px 14px;padding:28px 18px 16px;box-shadow:4px 4px 0 #C9BEFF}
.tomb .rip{font-family:var(--pix);font-size:11px;letter-spacing:.2em;color:var(--ink2)}
.tomb .here{font-family:var(--display);font-size:25px;line-height:1.05;color:var(--navy);margin:.2em 0 .1em}
.tomb .epi{color:var(--ink2);font-size:19px;margin:.2em 0 0!important}
.badge{display:inline-block;font-family:var(--pix);font-size:10px;letter-spacing:.02em;text-transform:uppercase;padding:2px 9px;border:2px solid var(--navy);border-radius:999px;background:var(--yellow);vertical-align:2px;white-space:nowrap}
.badge.m{background:var(--pink);color:#fff}
.badge.t{background:var(--turq2)}
.badges{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:.8em;align-items:center;font-size:16px;color:var(--ink2)}
.callout{background:var(--yellow);border:2.5px solid var(--navy);border-radius:14px;padding:8px 14px;margin:.2em 0 .7em;box-shadow:3px 3px 0 var(--pink)}
.callout p{margin:0!important}
.got{background:var(--turq2);border:2.5px solid var(--navy);border-radius:14px;padding:8px 14px;margin:.4em 0 .7em}
.got p{margin:0!important}
@media (prefers-reduced-motion:reduce){.anim,.hint{animation:none}#choices button,#choices button:hover,#choices button:active{transform:none}}
</style>

<main id="app">
  <div class="screen">
    <canvas id="scene" width="240" height="180" aria-label="Game scene"></canvas>
    <div class="tog">
      <button type="button" id="musBtn" aria-label="Music" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 17.2a3.2 3.2 0 1 1-2-2.96V5.2l11-2.2v11.6a3.2 3.2 0 1 1-2-2.96V7.4l-7 1.4z" fill="currentColor"/><line class="x" x1="3" y1="3.5" x2="21" y2="20.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button>
      <button type="button" id="sfxBtn" aria-label="Sound effects" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 9h4l5-4.2v14.4l-5-4.2h-4z" fill="currentColor"/><path d="M16 8.6a4.8 4.8 0 0 1 0 6.8M18.6 6a8.4 8.4 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><line class="x" x1="3" y1="3.5" x2="21" y2="20.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button>
    </div>
    <div class="hint" id="hint">Tap ♪ for music<br>and sound!</div>
    <div id="hud" hidden></div>
  </div>
  <section id="text" aria-live="polite"></section>
  <div id="choices"></div>
</main>

<script>
(() => {
'use strict';

/* ---------- basics ---------- */
const $ = s => document.querySelector(s);
const textEl = $('#text'), choicesEl = $('#choices'), hudEl = $('#hud');
const cv = $('#scene');
let g = cv.getContext('2d');
const W = 240, H = 180;
g.imageSmoothingEnabled = false;
const reduceMotion = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();
let DAY_MS = 1500;

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const KEY = { save: 'samarkand-trail-save-v3', top: 'samarkand-trail-top-v1', graves: 'samarkand-trail-graves-v1', sound: 'samarkand-trail-sound', music: 'samarkand-trail-music' };

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const chance = p => Math.random() < p;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const weighted = obj => { const e = Object.entries(obj).filter(([, w]) => w > 0); const t = e.reduce((s, [, w]) => s + w, 0); let r = Math.random() * t; for (const [k, w] of e) { r -= w; if (r <= 0) return k; } return e.length ? e[e.length - 1][0] : null; };
const hash = n => { let x = Math.imul((n | 0) ^ 0x9e3779b9, 0x85ebca6b); x ^= x >>> 13; x = Math.imul(x, 0xc2b2ae35); x ^= x >>> 16; return (x >>> 0) / 4294967295; };
const strHash = s => { let h = 7; for (let i = 0; i < s.length; i++) h = (Math.imul(h, 31) + s.charCodeAt(i)) | 0; return h; };
const listJoin = a => a.length <= 1 ? (a[0] || '') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];
const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + 's')}`;
const money = n => `${(Math.round(n * 100) / 100).toLocaleString('en-US', { minimumFractionDigits: Math.abs(n % 1) > 0.004 ? 2 : 0, maximumFractionDigits: 2 })} ${Math.abs(n - 1) < 0.004 ? 'tanga' : 'tangas'}`;
const cap = s => s[0].toUpperCase() + s.slice(1);

/* ---------- dates (1404, Gregorian, like Clavijo) ---------- */
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const EPOCH = Date.UTC(1404, 0, 1);

  { t: 'The tortoise and the two ducks', s: 'Two ducks and a tortoise lived by a pond that was drying up. The ducks offered to fly the tortoise to a new lake. He would bite the middle of a stick, and they would each hold an end. “Whatever happens, do not talk,” they said. Over a village, people pointed and laughed: look, ducks carrying a tortoise! The tortoise opened his mouth to say mind your own business. This one is from Kalila and Dimna, and storytellers always finish it by staring at someone in the audience who talks too much.', flag: null },

  ray: { name: 'Tehran', kind: 'town', region: 'plateau', xy: [82, 146], store: 1.3,

    hist: 'Ray is one of the oldest cities in Persia; the Greeks called it Rhages. The caliph Harun al-Rashid, of the Thousand and One Nights, was born here. So was the physician al-Razi, the first doctor to tell smallpox from measles. The Mongols destroyed Ray in 1220, and its people drifted to nearby villages like Tehran.',
    food: ['pomegranates', 'You split a pomegranate the size of your head. Everyone ends up pink to the elbows.', 2],
    talk: [['An old man in a garden', 'My grandfather’s grandfather was from Ray. Now we are from Tehran. In another hundred years someone will be from wherever this is going.'],
      ['A well digger', 'The water comes down from the mountains underground, through the qanat. I dig the qanat. Do not ask me about the qanat unless you have all afternoon.', 'Fine. A qanat is a tunnel that carries water for miles under the ground, sloping so gently the water barely notices. Every hundred paces there is a shaft for air. From above it looks like a line of anthills. My grandfather dug this one. His grandfather dug the one before.'],
      ['A storyteller in the bazaar', 'Everyone on this road is going to Samarkand. Even the people going the other way are going to Samarkand eventually.', 'legend:0']],
    road: ['A pilgrim', 'After Damghan the land turns salty. Fill your skins. A man I know drank from a pretty pond out there and hiccuped for a week.'] },
  ordu: { name: 'the Ordu', label: 'Ordu', kind: 'town', region: 'plateau', xy: [100, 144], store: 1.6, army: true,
    look: 'Timur’s army camp is a whole city on the move: streets of tents, markets, cooks, blacksmiths, horses, elephants from India and about ten thousand opinions about dinner. Timur is somewhere in the middle. You stay away from the middle.',
    hist: 'In 1402 Timur crushed the Ottoman sultan Bayezid at the Battle of Ankara, one of the biggest battles of the age, and took him prisoner. Before that his armies had sacked Damascus and Baghdad. Now the whole army is heading home: soldiers, families, herds, Indian war elephants, and thousands of craftsmen and captives that Timur is taking to build up Samarkand.',
    food: ['army bread', 'The army ovens are the size of yurts. The bread is round, hot and free. Nobody asks where the flour came from.', 0],
    talk: [['A soldier', 'We beat the Ottoman sultan at Ankara. Mostly I guarded camels. I would like that on my grave, if it comes to it.'],
      ['An elephant keeper from Delhi', 'They are not war elephants anymore. Now they carry things. Honestly, they seem happier.', 'Elephants remember everything. This one remembers that I owe her a melon from Multan. I am reminded daily.'],
      ['A potter’s daughter from Damascus named Nur', 'We used to live by the Great Mosque. Now we live wherever the elephants stop.', 'My father painted birds on bowls in Damascus for thirty years. Timur’s men took us and the bowls together. Now I paint them in a tent. The birds do not know the difference. You can have this one, if you like. For a few coins. I am saving for something.', { wonder: 'bowl', cost: 25, label: 'Buy Nur’s painted bowl' }]],
    road: ['A quartermaster', 'Near Nishapur the army turns off to the summer pastures. After that you are on your own again, and the bandits know it.'] },
  damghan: { name: 'Damghan', kind: 'town', region: 'plateau', xy: [118, 138], store: 1.5,
    look: 'Outside town stand two towers built from mud and the heads of Timur’s enemies. Locals say lights flicker on top of them at night. A passing ambassador said the wind here blows straight out of hell. The bakery is very good.',
    hist: 'Damghan is ancient. Its Tarikhaneh mosque, built around 750, may be the oldest mosque in Iran. The towers outside town are new. Clavijo saw them in 1404 and wrote that they were made of mud and the heads of men, Timur’s warning to anyone thinking of rebelling.',
    food: ['pistachios', 'Damghan pistachios are famous all over Persia. You buy a bag. They are worth the fame.', 2],
    talk: [['A Castilian ambassador with a bad sunburn', 'The wind here is so hot it seems to come out of hell. Also, today our falcon escaped.'],
      ['A baker', 'The towers? You get used to them. No. You don’t.', 'My father said the heads were rebels. My uncle said they were just people who were standing nearby. Nobody here talks about it after dark. Buy some bread.'],
      ['A carter', 'East of here, carry water. The land goes salty. You can drink it once.', 'legend:1']],
    road: ['A carter', 'Nishapur is next, then Mashhad. Nishapur has turquoise, poets and graves. Mashhad has everything else.'] },
  nishapur: { name: 'Nishapur', kind: 'town', region: 'khorasan', xy: [156, 124], store: 1.5,
    look: 'Nishapur is famous for two things: sky-blue turquoise dug from the hills, and Omar Khayyam, the poet and astronomer who is buried here. He wrote that we are all pieces moved around a board by fate. He also fixed the calendar, which was nice of him.',
    hist: 'The Sasanian king Shapur founded Nishapur, and it grew into one of the great cities of the world. The poets Attar and Omar Khayyam lived here. In 1221 a Mongol commander was killed attacking the walls. His widow, a daughter of Genghis Khan, ordered every living thing in the city killed, down to the cats and dogs.',
    legend: 'The poet Attar of Nishapur wrote The Conference of the Birds. In it, the hoopoe leads all the birds of the world on a long journey to find their king, the Simurgh. Most give up along the way. Thirty birds make it to the end, look into a lake, and see only themselves. In Persian, thirty birds is si murgh.',
    food: ['lamb kebab', 'The kebab seller fans the coals with a palm leaf and sings to the meat. It works.', 3],
    sights: ['khayyam', 'turquoise'],
    talk: [['A turquoise seller', 'This stone brings luck. If it turns green, the luck has been used.', 'The best turquoise comes from the mines above town, the blue of the sky at noon. I have one as big as an egg. Not cheap. Kings have asked about it. Well, one king. Well, his cook.', { wonder: 'turquoise', cost: 120, label: 'Buy the egg-sized turquoise' }],
      ['A student at the madrasa', 'Khayyam says drink wine, for you do not know where you came from or where you are going. My teacher says he did not mean real wine. I think he meant real wine.', 'Khayyam measured the length of the year so exactly that his calendar is better than the one the Christians use. I copied his star tables by hand. It took me a winter. I would sell them, for a little. I need to buy shoes.', { wonder: 'stars', cost: 40, label: 'Buy Khayyam’s star tables' }],
      ['A pilgrim', 'Mashhad is a few days’ walk. Bring something to give at the shrine. I am bringing a rug. My donkey is bringing me.']],
    road: ['A pilgrim', 'At the shrine in Mashhad, people tie a strip of cloth to the grille and make a wish. Bring a coin for the shrine, and bread for the poor.'] },
  mashhad: { name: 'Mashhad', kind: 'town', region: 'khorasan', xy: [176, 114], store: 1.6, letter: 45,
    look: 'Pilgrims from all over the world crowd the golden shrine of Imam Reza. Beggars, scholars, horse traders and pickpockets work the same busy streets. From here, two different roads lead to Samarkand.',
    hist: 'Imam Reza, the eighth imam of the Shia, died here in 818. People say he was poisoned with grapes. Oddly, the caliph Harun al-Rashid, of the Thousand and One Nights, is buried in the same shrine. Nearby Tus was the home of Ferdowsi, who wrote the Shahnameh, the great Persian book of kings.',
    legend: 'Ferdowsi spent thirty years writing sixty thousand couplets about kings and heroes. The sultan had promised him a gold coin for every couplet, then sent silver instead. Ferdowsi gave the silver away to a bath attendant and a sherbet seller. Years later the sultan felt bad and sent the gold. It came in through one gate of Tus just as Ferdowsi’s coffin went out the other.',
    food: ['saffron rice', 'The rice is gold with Khorasan saffron and studded with barberries. It tastes like a sunset, if a sunset were sour in places.', 3],
    sights: ['shrine'],
    talk: [['A horse trader', 'Two roads from here. The ambassador’s road goes by Balkh and the Iron Gates. Long, with mountains. The other goes by Merv and Bukhara. Shorter, and the Karakum will try to kill you. I sell horses for both.'],
      ['A pilgrim from Herat', 'I walked here barefoot. I am riding home. I have done enough walking for the next life too.'],
      ['A scholar', 'Merv was the greatest city in the world once. Then the Mongols came. It is a good place to think about things, if you have water.', 'legend:6']],
    road: ['A horse trader', 'The southern road has the Iron Gates, and above them, if the shepherds are to be believed, the nest of the Simurgh. The northern road has Bukhara, and Bukhara has the best plov in the world. Choose with your stomach.'] },
  murghab: { name: 'the Murghab River', label: 'Murghab', kind: 'river', region: 'desert', xy: [198, 140],
    river: { depth: [2.0,2.2,3.0,3.6,3.8,3.2,2.4,1.8,1.5,1.5,1.7,1.9], width: [180, 240], ferry: 12, who: 'Two brothers with a raft of logs' },
    look: 'The Murghab flows down from the mountains of Afghanistan and runs north until the sand swallows it. Here it is still wide, brown and in no hurry.',
    local: [['A herder', 'The brothers with the raft charge too much. They are also the only reason anyone is alive on the other side.'], ['A fisherman', 'There are fish in there as big as your leg. Do not put your leg in there.']] },
  andkhoy: { name: 'Andkhoy', kind: 'town', region: 'desert', xy: [232, 140], store: 1.8,
    look: 'Andkhoy is where the desert stops for a rest. There are melons, wells, and a great many camels lying down with the look of camels who have just done something hard.',
    food: ['melon', 'A slice of melon as long as your arm, cold from the well. Everyone goes quiet for a while.', 1],
    sights: ['melon'],
    talk: [['A melon grower', 'Khorasan melons are the best in the world. People say that about their own melons everywhere, but here it is true.', 'My best melon is for a king, but no king has come. Take it to Samarkand if you like. Carry it gently, and do not take too long about it. A melon waits for nobody.', { wonder: 'melon', cost: 8, label: 'Buy the best melon in Khorasan' }],
      ['A camel driver', 'Never sleep downwind of your camels. Learn from me.'],
      ['A boy', 'Have you seen the giraffe? People say a giraffe from Egypt is coming this way. My brother says he saw it. My brother lies.']],
    road: ['A camel driver', 'Balkh is two days. Then the Oxus. Have your letter ready, or your excuses.'] },
  balkh: { name: 'Balkh', kind: 'town', region: 'oasis', xy: [254, 136], store: 1.8, letter: 60,
    look: 'Balkh calls itself the Mother of Cities, and nobody knows how old it really is. The Mongols wrecked it in 1220. Its ancient walls still run for miles around a town that is now much smaller than they are.',
    hist: 'Balkh is ancient Bactra. By tradition the prophet Zoroaster preached here. Alexander the Great married a Bactrian princess, Roxana. For centuries the great Buddhist monastery of Nawbahar stood here, and its keepers, the Barmakids, later ran the empire of the caliph Harun al-Rashid. The poet Rumi was born here in 1207.',
    food: ['dried apricots', 'The apricots of Balkh are dried on the rooftops. You buy a bag and eat half of it before you are back at the camels.', 2],
    sights: ['lapis'],
    talk: [['A gardener', 'The poet Rumi was born near here. He left as a boy. Everyone leaves Balkh. Then they write poems about it.', 'When Rumi was a boy, his family fled the Mongols. In Nishapur they met the old poet Attar, who gave the boy a book and said: this one will set the hearts of the world on fire.'],
      ['A brick maker', 'I make new bricks. My neighbor digs up old bricks. We sell to the same people.'],
      ['An old soldier', 'At the Oxus they will want your letter. Whence you come, whither you go. If you have no letter, you have no Oxus.', 'legend:0']],
    road: ['An old soldier', 'Past the Oxus is the Iron Gates. Keep your eyes on the cliffs. The shepherds say the Simurgh nests up there.', 'simurgh'] },
  termez: { name: 'the Oxus at Termez', label: 'Termez', kind: 'river', oxus: true, region: 'oasis', xy: [272, 124],
    river: { depth: [8,8,10,12,14,16,16,15,12,10,9,8], width: [900, 1300], ferry: 15, who: 'The ferrymen' },
    look: 'The Oxus! The great river of Central Asia is so wide you can barely see the far bank. Timur’s army crossed it on a bridge of boats, and then he had the bridge torn down. Now there are only ferries, and nobody rides one without a letter saying where they came from and where they are going.',
    local: [['A ferryman', 'Letter. Whence and whither. No letter, no boat. I don’t make the rules. Timur makes the rules. I make the boat.'], ['A fisherman', 'People with no letter cross at night on blown-up sheepskins. The ferrymen go out with lanterns to catch them. It is the most exciting thing that happens here.']] },
  irongates: { name: 'the Iron Gates', label: 'Iron Gates', kind: 'landmark', region: 'mountain', xy: [286, 102],
    look: 'The road squeezes into a canyon so narrow and steep it looks carved by hand. Legend says iron gates once hung here, and nobody passed without permission. The gates are gone. The permission part is not.',
    hist: 'The Chinese monk Xuanzang walked through this pass around 630, on his way to India to collect Buddhist books. He wrote that the cliffs were the color of iron and that iron-plated gates once closed the road. Clavijo came through in 1404 and said much the same. For centuries it marked the border between the lands of Samarkand and everything to the south.',
    talk: [['A shepherd', 'In winter the snow closes this pass. In summer the sun closes it. In between, it is open, mostly.', 'My grandfather saw the Simurgh once. Wings like a sunset, he said, and a cry like every bird at once. He came home with a feather, and then he lost it. He was not a careful man. Keep looking up.', { flag: 'simurgh' }],
      ['A man at a little table', 'There is no toll. I am collecting one anyway. It is very small.'],
      ['A traveler', 'From here it is all downhill to Kesh. That is what everyone says, and it is never true.']],
    road: ['A shepherd', 'Kesh is next, Timur’s hometown. Do not say anything rude about Timur there. Do not say anything rude about Timur anywhere, actually.'] },
  kesh: { name: 'Kesh', kind: 'town', region: 'oasis', xy: [298, 80], store: 1.6,
    look: 'Kesh is Timur’s hometown, and he is building a palace here called the Aq Saray. Its gateway is gigantic and covered in blue and gold tile. Workers have been up on the scaffolding for twenty years. They wave.',
    hist: 'Timur was born near Kesh in 1336, the son of a minor chief, and rose to conquer more land than anyone since Genghis Khan. He began the Aq Saray, the White Palace, in 1380. Over its gate he had written: If you doubt our power, look at our buildings.',
    food: ['green apples', 'The apples are green, sour and loud. Everyone crunches at once.', 1],
    talk: [['A tile cutter', 'The inscription over the gate says that if you doubt our power, look at our buildings. I cut the tiles for “doubt.” It took a month.'],
      ['A woman selling apples', 'They call it Shahr-i Sabz, the green city, because of the gardens. Not because of the apples. The apples are just green.'],
      ['A messenger', 'Samarkand is two days. Timur has invited everyone. Some people even want to go.', 'They say Timur plays chess on a board twice the normal size, with camels and giraffes among the pieces, because ordinary chess is too small for him. Nobody has ever beaten him. Nobody has ever tried very hard.']],
    road: ['A messenger', 'You will see the domes of Samarkand before you see the walls. Then you will stop and stare. Everyone does.'] },
  tejen: { name: 'the Tejen River', label: 'Tejen', kind: 'river', region: 'khorasan', xy: [194, 98],
    river: { depth: [1.6,1.8,2.8,3.2,2.6,1.6,1.0,0.7,0.6,0.8,1.2,1.4], width: [120, 200], ferry: 6, who: 'A man with a donkey' },
    look: 'This river starts near Herat, changes its name twice, and wanders off into the desert. By late summer it is barely trying.',
    local: [['A man with a donkey', 'I will carry your things across. My donkey has never drowned.', 'The donkey looks like it has thought about it.'], ['A shepherd', 'In August you can cross it in slippers.']] },
  merv: { name: 'Merv', kind: 'town', region: 'desert', xy: [212, 84], store: 1.9, letter: 60,
    look: 'Merv may once have been the biggest city in the world, until the Mongols came in 1221. Its walls still run for miles, and the great dome of Sultan Sanjar still stands. A few families keep gardens among the ruins and sell melons to visitors.',
    hist: 'In the 1100s Merv was the capital of the Seljuk sultan Sanjar and may have been the largest city on earth, with libraries holding hundreds of thousands of books. In 1221 the Mongol prince Tolui took the city and killed nearly everyone in it. Sanjar’s great domed tomb survived. The city never really did.',
    food: ['melon', 'A Merv melon, cold from the well, so sweet it squeaks.', 1],
    sights: ['melon'],
    talk: [['A melon seller', 'People come to look at the ruins. Then they are thirsty. That is where I come in.', 'My best melon is for a king, but no king has come. Take it to Samarkand. Carry it gently, and hurry. A melon waits for nobody.', { wonder: 'melon', cost: 8, label: 'Buy the best melon in Khorasan' }],
      ['A gravedigger', 'My work here is mostly finished.'],
      ['A caravan guide', 'From here to the Oxus is sand. Fill every skin. Then fill the goat.', 'legend:6']],
    road: ['A Turkmen rider', 'The Karakum is next. Black sand. Travel early in the day, and listen for nothing at night. If the sand calls your name, do not answer.', 'ghul'] },
  sardoba: { name: 'the Sardoba', label: 'Sardoba', kind: 'landmark', region: 'desert', xy: [230, 72],
    look: 'In the middle of the sands sits a sardoba, a domed brick cistern that keeps water cool all summer. Someone paid to build it so that strangers would not die out here. You will never know their name. You thank them anyway, and fill every skin.',
    hist: 'Cisterns like this one, and the caravanserais along the road, were often paid for by a waqf: a charitable trust someone set up so that strangers would have water and shelter forever. Some of these trusts kept their wells running for hundreds of years after the founders died.',
    talk: [['A Turkmen herder', 'The water is sweet. Do not let the camels in first.'],
      ['A tired merchant', 'I have crossed this desert eleven times. It has not gotten smaller.'],
      ['A traveler pointing at the wall', 'Someone wrote on the shady side: I was here, and I was thirsty.']] },
  amul: { name: 'the Oxus at Amul', label: 'Amul', kind: 'river', oxus: true, region: 'desert', xy: [248, 62],
    river: { depth: [8,8,10,12,14,16,16,15,12,10,9,8], width: [800, 1200], ferry: 15, who: 'The ferrymen' },
    look: 'At Amul the Oxus is wide, slow and the color of milky tea. The ferrymen here want your letter too. Timur’s officers check. Sometimes.',
    local: [['A ferryman', 'Letter first, then the boat. That is the order of things.'], ['A boy', 'At night people float across on sheepskins. My uncle holds the lantern. He has never caught anyone who was polite to him.']] },
  bukhara: { name: 'Bukhara', kind: 'town', region: 'oasis', xy: [266, 50], store: 1.5,
    look: 'Bukhara is a city of scholars, domes and busy markets. The Kalyan Minaret has stood since 1127. Legend says Genghis Khan looked up at it, his hat fell off, and he spared it out of respect. Locals warn you not to drink from the pools, where a tiny worm lives. Later it lives in you.',
    hist: 'Bukhara was the capital of the Samanids, Persian kings who made it a center of learning in the 900s. Ibn Sina, the greatest doctor of his age, grew up here and read every book in the royal library. In 1220 Genghis Khan rode his horse into the great mosque, had the Quran chests emptied to make feed troughs, and told the people: I am the punishment of God.',
    food: ['plov', 'A mountain of rice with carrots, raisins and lamb, cooked in a pot big enough to bathe in. Everyone eats too much. Nobody regrets it.', 3],
    talk: [['A bookseller', 'Paper from Samarkand, ink from China, words from God. I just sell them.', 'I have a copy of Ibn Sina’s Canon of Medicine. Five volumes. The greatest book about the body ever written, and the heaviest. For a scholar, I make a price.', { wonder: 'canon', cost: 120, label: 'Buy Ibn Sina’s Canon' }],
      ['A water carrier', 'Boil the water. Or don’t, and visit the barber when the worm comes out.', 'When the rishta worm starts to come out of your leg, the barber winds it around a little stick, a few turns every day, slowly, slowly. Pull too fast and it breaks. Bukhara is a city of patience.'],
      ['A student', 'Avicenna read every book in the royal library here before he was eighteen. I am nineteen. I have read some books.', 'legend:5']],
    road: ['A courier', 'Next is the Rabat-i Malik, the old royal caravanserai. Three nights free. After that, Samarkand, and the feast.'] },
  rabat: { name: 'Rabat-i Malik', label: 'Rabat-i Malik', kind: 'landmark', region: 'oasis', xy: [284, 44],
    look: 'The Rabat-i Malik is a royal caravanserai with an enormous gateway and a domed cistern across the road. Travelers may stay three nights. The camels would stay forever.',
    hist: 'A Karakhanid ruler of Samarkand, Shams al-Mulk, built the Rabat-i Malik around 1078 as a royal stopping place on the road to Bukhara. Caravanserais like it stood about a day’s ride apart along the Silk Road, so that merchants, pilgrims and strangers could rest, trade and swap stories every night of the journey.',
    sights: ['stories'],
    talk: [['The caravanserai keeper', 'Three nights. On the fourth I start charging. On the fifth I start asking questions.'],
      ['A servant of the Chinese envoy', 'My master came to Samarkand nine years ago for a short visit.', 'Timur kept my master waiting nine years, because the Chinese emperor once called Timur his vassal. Now Timur is going to invade China. My master is very, very polite to everyone.'],
      ['A courier', 'Timur is home. Everyone is invited to the feast. Everyone. I have been saying it all week.']] },
  samarkand: { name: 'Samarkand', kind: 'end', region: 'oasis', xy: [306, 52] },
};

  murghab: { to: 'andkhoy', len: 35, region: 'desert', dry: 1 },

  termez: { to: 'irongates', len: 25, region: 'mountain', dry: 0 },
  irongates: { to: 'kesh', len: 16, region: 'mountain', dry: 0 },
  kesh: { to: 'samarkand', len: 14, region: 'oasis', dry: 0 },
  tejen: { to: 'merv', len: 30, region: 'desert', dry: 0.6 },
  merv: { to: 'sardoba', len: 18, region: 'desert', dry: 1 },
  sardoba: { to: 'amul', len: 19, region: 'desert', dry: 1 },
  amul: { to: 'bukhara', len: 18, region: 'oasis', dry: 0 },

};
const edgeOf = id => { const e = EDGES[id]; return typeof e === 'function' ? e(S) : e; };
const MILE = (() => { const m = { tabriz: 0 }; const walk = (id, army, route) => { let cur = id, guard = 0; while (cur !== 'samarkand' && guard++ < 40) { const raw = EDGES[cur]; const e = typeof raw === 'function' ? raw({ army, route }) : raw; if (m[e.to] == null) m[e.to] = m[cur] + e.len; cur = e.to; } }; walk('tabriz', false, 'A'); walk('tabriz', true, 'A'); walk('mashhad', false, 'B'); m.ordu = m.ray + 28; return m; })();

const INJ = {

    S.arrows > 0 && !S.army && !S.atNode ? { label: 'Go hunting', sub: `${S.arrows} arrows`, run: () => ({ type: 'hunt', bonus: false }) } : null,
    S.camels > 1 ? { label: 'Slaughter a camel for meat', sub: 'you will get about 250 lb', run: () => { const [nm] = loseCamels(1, S.herd.length - 1); S.food += 250; return msg(`You choose ${nm}. ${has('aybike') ? 'Aybike does it herself, quickly, and does not speak to anyone for the rest of the day.' : 'Nobody talks much that evening.'} You gain 250 pounds of meat.`, { who: 'p3', emo: 'dots' }); } } : null,
    { label: 'Forage for roots and berries', sub: 'lose a day', run: () => { loseDays(1); const f = ri(10, 30) + ([3, 4, 5].includes(monthOf(S.day)) ? 15 : 0); S.food += f; return msg(`You spend a day picking through the scrub. You find wild onions, a few berries and something Anahit says is probably fine. You gain ${f} pounds of food.`); } },
    { label: 'Look at the goat', run: () => msg('You look at the goat. The goat looks at you. You decide to keep going hungry instead.', { who: 'goat', emo: '!' }) },
    { label: 'Keep going, hungry', run: () => msg('You tighten your belts and keep walking. Everyone is getting weaker.') },
  ] };
}
function thirstCrisis() {
  return { type: 'choice', title: 'Out of water', who: 'p0', emo: 'drop', sound: 'bad', text: 'The last water skin is empty. The camels can go a while longer. You cannot.', options: [
    { label: 'Dig in a dry riverbed', sub: 'lose a day', run: () => { loseDays(1); if (chance(has('aybike') ? 0.7 : 0.45)) { S.water = Math.max(S.water, S.skins * 0.6); return msg(`${has('aybike') ? 'Aybike picks the spot.' : 'You pick a spot where the sand looks darker.'} After half a day of digging, muddy water seeps into the hole. It is the best thing you have ever tasted.`, { sound: 'good' }); } return msg('You dig all day and find only more sand. Everyone is thirstier than when you started.', { sound: 'bad' }); } },
    { label: 'Travel at night to sweat less', sub: 'slower, cooler, for four days', run: () => { S.nightDays = 4; return msg('You rest through the heat of the day and walk under the stars. It is slower, and very beautiful, and you are still thirsty.'); } },
    { label: 'Push on to the next well', run: () => msg('You push on. Nobody talks. Talking uses water.') },
  ] };
}

/* ---------- illnesses with remedies ---------- */
function cureMsg(m, text) { m.sick = null; m.care = 0; m.hp = Math.min(100, m.hp + 6); return msg(text.replace(/\{n\}/g, who(m)), { who: 'p' + S.party.indexOf(m), emo: 'heart', sound: 'good' }); }
function remedyOdds(p) { return p + (has('anahit') ? 0.15 : 0); }
function sickEvent(m, kind) {
  m.sick = kind; m.care = 0; m.hp = Math.max(1, m.hp - 8);
  const sk = SICK[kind], n = who(m), idx = 'p' + S.party.indexOf(m);
  const opts = [];
  const nurse = has('anahit') && m.name !== 'Anahit';
  if (kind === 'dysentery') {
    if (nurse) opts.push({ label: 'Anahit’s cure: rice water and pomegranate peel', run: () => { m.care = 0.25; return msg('Anahit brews something brown and makes them drink all of it. It works. It also tastes like a boot.'); } });
    opts.push({ label: 'Boil all your water for a week', sub: 'slower, but safer for everyone', run: () => { S.boilDays = 7; m.care = 0.12; return msg('From now on every drop gets boiled. It takes forever. Nobody else gets sick.'); } });
  }
  if (kind === 'fever') {
    opts.push({ label: 'Feed them cooling foods: yogurt, melon, cucumber', sub: 'uses 20 lb of food', disabled: S.food < 20, run: () => { S.food -= 20; m.care = 0.2; return msg('Heat in the blood calls for cold foods. They eat yogurt and melon and say they feel cooler. They might be right.'); } });
    opts.push({ label: 'Bleed them, like the barbers do', sub: 'risky', run: () => chance(remedyOdds(0.45)) ? cureMsg(m, 'You let a little blood from {n}’s arm. By morning the fever has broken. Anahit says it was luck.') : (m.hp = Math.max(1, m.hp - 15), msg(`You let a little blood. ${n} ${m.leader ? 'feel' : 'feels'} much worse. Anahit says she could have told you that.`, { sound: 'bad' })) });
  }
  if (kind === 'eye') {
    if (S.items.rue) opts.push({ label: 'Burn wild rue', sub: 'isfand smoke drives off the eye', run: () => { S.items.rue--; return cureMsg(m, 'You drop wild rue seeds on the coals. They pop and crackle, and fragrant smoke curls around {n}. Everyone feels better. Even the goat.'); } });
    if (S.items.bead) opts.push({ label: 'Hang a blue bead on them', run: () => cureMsg(m, 'You hang the blue bead around {n}’s neck. The evil eye looks elsewhere.') });
    opts.push({ label: 'Say a prayer and spit three times', run: () => chance(0.4) ? cureMsg(m, 'You pray and spit three times, carefully, over your left shoulder. It works. Yaqub says it was a coincidence and spits anyway.') : msg('You pray and spit three times. Nothing happens, except that the goat is now offended.') });
  }
  if (kind === 'jinn') {
    opts.push({ label: 'Put iron under their pillow', sub: 'jinn hate iron', run: () => chance(remedyOdds(0.4)) ? cureMsg(m, 'You slide a knife under {n}’s pillow. In the night they sit up, say thank you to nobody, and sleep like a stone. The jinn is gone.') : msg('You slide a knife under their pillow. The jinn does not seem to mind iron. It may be a very modern jinn.') });
    if (has('otabek') && m.name !== 'Otabek') opts.push({ label: 'Otabek plays music to coax it out', run: () => chance(0.6) ? cureMsg(m, 'Otabek plays his dutar all evening, softer and softer. At midnight {n} laughs, yawns and says the visitor has left.') : msg('Otabek plays for hours. The jinn requests another song.') });
    opts.push({ label: 'Take them to a shrine', sub: 'cured at the next town', run: () => { m.care = 0.08; S.flags.shrineCure = m.name; return msg(`You will find a shrine at the next town. ${n} ${m.leader ? 'agree' : 'agrees'}, in between conversations with no one.`); } });
  }
  if (kind === 'plague') {
    opts.push({ label: 'Keep them apart from everyone', sub: 'stops it spreading', run: () => { S.flags.isolate = m.name; return msg(`${n} ${m.leader ? 'walk' : 'walks'} a hundred paces behind the caravan and ${m.leader ? 'sleep' : 'sleeps'} alone. You leave food on a stone. It is the right thing to do and it is awful.`); } });
    opts.push({ label: 'Burn their bedding and a coat', sub: 'uses a felt coat', disabled: S.coats < 1, run: () => { S.coats--; S.flags.isolate = m.name; m.care = 0.04; return msg('You burn the bedding and a felt coat. The fleas go with them. Most of the fleas.'); } });
  }
  if (kind === 'heat') {
    opts.push({ label: 'Travel at night for a few days', sub: 'slower, cooler', run: () => { S.nightDays = 5; m.care = 0.15; return msg('You rest in what shade there is and walk under the stars.'); } });
    opts.push({ label: 'Give them extra water', sub: 'uses a skin of water', disabled: S.water < 1, run: () => { S.water -= 1; m.care = 0.2; return msg('You pour water over their head and make them drink the rest. They complain, which is a good sign.'); } });
  }
  if (kind === 'frost') opts.push({ label: 'Wrap them in a spare felt coat', disabled: S.coats < 1, run: () => { m.care = 0.2; return msg('You bundle them up in felt until only their nose shows. The nose says thank you.'); } });
  if (kind === 'worm') opts.push({ label: 'Wind it out on a stick, slowly', sub: 'lose 2 days', run: () => { loseDays(2); return cureMsg(m, 'You wind the worm onto a little stick, a few turns a day, slowly, slowly. Patience. Then it is out, all of it. {n} faints a little.'); } });
  if (kind === 'bile') {
    if (has('otabek') && m.name !== 'Otabek') opts.push({ label: 'Otabek plays the dutar for them', run: () => cureMsg(m, 'Otabek plays the saddest song he knows, then a silly one, then a sad one again. Somewhere in the middle {n} starts laughing and cannot stop. The black bile has drained away, says Anahit.') });
    opts.push({ label: 'Tell stories around the fire', sub: 'lose a day', run: () => { loseDays(1); return chance(0.7) ? cureMsg(m, 'You sit up late telling stories. Yaqub tells one about a camel who became a vizier. {n} feels much better.') : msg('You tell stories all night. Everyone else feels better.'); } });
  }
  if (kind === 'exhaustion') opts.push({ label: 'Slow the pace to steady', run: () => { S.pace = 1; m.care = 0.1; return msg('You slow down. Everyone breathes out at once.'); } });
  if (!S.army) opts.push({ label: 'Rest for two days', run: () => { m.care = Math.max(m.care, 0.1); return [msg('You make camp and rest for two days.'), ...restDays(2)]; } });
  opts.push({ label: 'Keep going and hope', run: () => msg('You keep going. Hope is free, at least.') });
  return { type: 'choice', title: 'Sickness', who: idx, emo: 'sweat', sound: 'bad', text: `${n} ${second(m, sk.has)}. ${pick(sk.why)}`, options: opts };
}
function pickIllness(c) {
  const pool = { dysentery: 22, fever: 12, eye: 9, jinn: c.region === 'desert' ? 7 : 3, bile: 5, plague: S.army ? 4 : 1.5, exhaustion: (S.pace > 1 || S.army) ? 14 : 4 };
  if (c.region === 'desert' || c.temp >= 4) pool.heat = c.temp >= 5 ? 24 : 10;
  if (c.temp <= 1 && S.coats < alive().length) pool.frost = 20;
  if (c.region === 'oasis') pool.fever += 8;
  if (S.route === 'B' && ['amul', 'bukhara', 'rabat'].includes(S.segFrom)) pool.worm = 14;
  if (S.boilDays > 0) pool.dysentery = 2;
  if (S.items.bead) pool.eye = 1;
  return weighted(pool);
}
function healthyPick() { const a = alive().filter(m => !m.sick); return a.length ? pick(a) : null; }
function stealable() {
  const opts = [];
  if (S.coats > 0) opts.push(() => { const n = Math.min(S.coats, ri(1, 3)); S.coats -= n; return plural(n, 'felt coat'); });
  if (S.food > 40) opts.push(() => { const n = ri(20, 80); S.food -= n; return `${n} pounds of food`; });
  if (S.arrows > 20) opts.push(() => { const n = Math.min(S.arrows, ri(1, 3) * 20); S.arrows -= n; return `${n} arrows`; });
  if (S.money > 15) opts.push(() => { const n = Math.min(S.money, ri(10, 40)); S.money -= n; return money(n); });
  if (S.camels > 1) opts.push(() => { const [nm] = loseCamels(1); return `${nm} the camel`; });
  if (S.skins > 1) opts.push(() => { const n = Math.min(S.skins - 1, ri(1, 2)); S.skins -= n; S.water = Math.min(S.water, S.skins); return plural(n, 'water skin'); });
  return opts.length ? pick(opts)() : null;
}
function legendItem(L, how) {
  S.heard[L.t] = true; S.legends = Object.keys(S.heard).length; if (L.flag) S.flags[L.flag] = true;
  return msg(`${how ? how + '<br><br>' : ''}${L.s}`, { title: L.t, sound: 'sparkle', date: false, scene: { mode: 'fire' } });
}
const unheard = () => LEGENDS.filter(L => !S.heard[L.t]);

/* ---------- road encounters ---------- */
function dervishEvent() {
  S.flags.dervishes = (S.flags.dervishes || 0) + 1;
  const asks = [['a loaf of bread', () => S.food >= 5, () => { S.food -= 5; }], ['a skin of water', () => S.water >= 1, () => { S.water -= 1; }], ['a single coin', () => S.money >= 1, () => { S.money -= 1; }], ['a song', () => true, () => {}]];
  const [what, , pay] = pick(asks.filter(a => a[1]()));
  return { type: 'choice', title: 'A dervish', who: 'p0', emo: '?', text: `A wandering dervish in a patched cloak steps into the road. He has a begging bowl, a tall felt hat and very bright eyes. He asks you for ${what}.`, options: [
    { label: `Give him ${what}`, run: () => { pay(); return dervishBoon(what); } },
    { label: 'Refuse', run: () => dervishCurse() },
  ] };
}
function dervishBoon(what) {
  const sick = alive().filter(m => m.sick);
  const intro = what === 'a song' ? (has('otabek') ? 'Otabek plays, and the dervish turns slowly in the road with his eyes closed.' : 'You sing. Badly. The dervish listens with great seriousness.') : 'He accepts it with both hands.';
  const r = Math.random();
  if (sick.length && r < 0.35) { const m = pick(sick); return cureMsg(m, `${intro} Then he touches {n}’s forehead and says a word you do not catch. The sickness lifts like fog.`); }
  if (!S.wonders.kashkul && r < 0.55) { S.wonders.kashkul = S.day; sfx.sparkle(); return msg(`${intro} Then he presses his begging bowl into your hands. It is carved from a coconut from somewhere very far away. “I have another,” he says. He does not.`, { title: 'A wonder!', after: wonderNote('kashkul') }); }
  if (!S.flags.blessed && r < 0.8) { S.flags.blessed = true; return msg(`${intro} “One death will pass you by,” he says, and walks off into the heat.`, { title: 'A blessing', sound: 'sparkle' }); }
  const L = unheard()[0]; if (L) return legendItem(L, `${intro} Then he sits down in the road and tells you a story.`);
  return msg(`${intro} He thanks you and walks off. Nothing happens. Probably.`);
}
function dervishCurse() {
  const r = Math.random();
  if (r < 0.25) return msg('“Your goat will never respect you,” says the dervish. The goat, who was listening, agrees.', { who: 'goat', emo: '!' });
  if (r < 0.5) { S.curse = 6; return msg('“May your sandals pinch until the next town!” says the dervish. They do. Everyone walks a little slower.', { sound: 'bad' }); }
  if (r < 0.7) { const f = Math.min(Math.floor(S.food), 20); S.food -= f; return msg(`“May your bread taste of sand!” says the dervish. That night it does. You throw out ${f} pounds of food.`, { sound: 'bad' }); }
  const m = healthyPick(); if (m) return sickEvent(m, 'eye');
  return msg('The dervish looks at you for a long time and then laughs. You do not know why. That is worse.');
}
function storytellerEvent() {
  const U = unheard(), L = U.length ? pick(U) : null;
  return { type: 'choice', title: 'Stories by the fire', scene: { mode: 'fire' }, who: 'p0', emo: 'sparkle', text: 'Every caravanserai has a fire, and every fire has a storyteller. This one has one enormous eyebrow, and he knows the whole Shahnameh, the adventures of Amir Hamza, the animal fables of Kalila and Dimna, half the Thousand and One Nights and an endless supply of Nasreddin. He will tell a tale for two tangas. Or, he says, he will pay for a good one.', options: [
    L ? { label: 'Pay for a story', sub: money(2), disabled: S.money < 2, run: () => { S.money -= 2; alive().forEach(m => m.hp = Math.min(100, m.hp + 3)); return legendItem(L, 'He leans into the firelight.'); } } : null,
    S.legends > 0 ? { label: 'Tell him one of yours', sub: 'stories are worth money here', run: () => { const p = 4 + S.legends * 2; S.money += p; return msg(`You tell him a story you heard on the road, with a few improvements. He listens with his whole eyebrow, then pays you ${money(p)}. “I will tell it better,” he says.`, { sound: 'coin' }); } } : null,
    { label: 'Go to sleep', run: () => msg('You fall asleep to the sound of someone else’s story. You dream about a camel who becomes a vizier.') },
  ] };
}
function nasreddinEvent() {
  S.flags.nasreddin = true;
  return { type: 'choice', title: 'A man on a donkey', who: 'goat', emo: '?', text: 'A man rides toward you sitting backwards on his donkey. “If I sat the right way, my back would be to you, which is rude,” he explains. This is Nasreddin, and he has a question: which is more useful, the sun or the moon?', options: [
    { label: 'The sun', run: () => { S.food += 15; return msg('“Wrong,” says Nasreddin. “The moon shines at night, when we need the light. The sun shines in the daytime, when it is already light.” He rides off. Later you find he has left you a bag of apricots and taken one of your hats.'); } },
    { label: 'The moon', run: () => { S.money += 10; return msg('“Correct!” cries Nasreddin. “The sun shines in the daytime, when it is light anyway.” He gives you ten tangas, then asks to borrow ten tangas, then rides off backwards.', { sound: 'coin' }); } },
  ] };
}
function buzkashiEvent() {
  S.flags.buzkashi = true;
  return { type: 'choice', title: 'Buzkashi', who: 'goat', emo: '!', text: 'A crowd of horsemen is playing buzkashi: two teams fight over a goat carcass at full gallop. Their goat has fallen apart. A rider trots over and looks at your goat with great interest.', options: [

  ] };

  return { type: 'choice', title: 'A voice in the dark', who: 'p' + S.party.indexOf(v), emo: '?', text: `In the middle of the night someone out in the dunes is calling ${v.leader ? 'your' : esc(v.name) + '’s'} name, in a voice that sounds exactly like ${v.leader ? 'your mother' : 'their mother'}.`, options: [
    { label: 'Answer it', run: () => { if (chance(0.5)) { loseDays(1); return msg('You answer. The voice laughs and moves farther off. You spend the next day searching the dunes for a person who was never there.', { sound: 'bad' }); } return msg('You answer. There is a long silence. Then the voice says, very politely, “Sorry, wrong caravan.”'); } },
    { label: 'Cover your ears and sing', run: () => has('otabek') ? msg('Otabek plays the loudest song he knows until sunrise. The voice gives up around the third verse.', { who: 'p2', emo: 'note' }) : (alive().forEach(m => m.hp = Math.max(1, m.hp - 3)), msg('You sing until dawn. The voice goes away. So does everyone’s sleep.')) },

  return { type: 'choice', title: 'Travelers going west', who: 'p0', emo: 'sparkle', text: 'A caravan heading west to Tabriz stops beside yours. Their camels and your camels inspect each other. Everyone else swaps news.', options: [
    { label: 'Swap news and stories', run: () => L ? legendItem(L, 'Their caravan master tells you a story from farther east.') : msg('They tell you the road ahead is long and the melons are excellent. Both turn out to be true.') },

  [1, 'Anahit has started a list of everyone’s complaints. It is long. Yours is on the second page.'],
  [2, 'Otabek has taught the goat to stamp in time with his drum. The goat is better at it than he is.'],
  [2, 'Otabek asks how many days until Samarkand. You tell him. He asks again an hour later.'],
  [3, 'Aybike spends the evening combing the burrs out of Lola’s wool and telling her secrets.'],
  [3, 'fact'],
  [4, 'Yaqub writes by firelight in a little book. When you ask what it is about, he covers the page. “The journey,” he says. “Mostly the goat.”'],
  [4, 'Yaqub teaches everyone to say thank you in Persian, Turkish, Armenian, Arabic and Hebrew. The goat learns none of them.'],
  [4, 'Yaqub writes a letter for a herder who wants to tell his sister he is alive. He will not take any money for it.'],
];

  const opts = BANTER.filter(([i]) => crewAlive(i)); if (!opts.length) return null;

  return msg(line === 'fact' ? `Aybike says: “${pick(CAMEL_FACTS)}”` : line, { who: 'p' + i, emo: pick(['heart', 'note', 'sparkle']) });

      const m = healthyPick(); if (!m || m.inj) return null;

  { w: c => S.camels > 0 && !c.rest ? 2.5 : 0, run: () => { const nm = someCamel(); loseDays(1); if (chance(has('aybike') ? 0.12 : 0.3)) { loseCamels(1, camelIdx(nm)); return msg(`${nm} wandered off in the night. You spend a day looking. You do not find ${nm}. Somewhere out there a camel is living its best life.`, { sound: 'bad' }); } return msg(`${nm} wandered off in the night. You spend a day finding ${nm}. ${nm} is not sorry.`); } },

  return null;
}

/* ---------- main loop ---------- */
let lastCue = 'title', forcedCue = null;
function musicCue() {
  switch (scene.mode) {
    case 'title': return 'title';
    case 'store': case 'haggle': return 'store';
    case 'walk': return S && S.army ? 'army' : curRegion();
    case 'node': return N[scene.node] && N[scene.node].army ? 'army' : 'town';
    case 'river': return 'river';
    case 'hunt': return 'hunt';
    case 'raft': return 'raft';
    case 'grave': return 'grave';
    case 'arrive': return scene.late ? 'late' : 'feast';
    case 'show': return 'town';
    case 'fire': return 'title';
    case 'reunion': return 'feast';
    case 'buzk': return 'hunt';
  }
  return lastCue;
}
function loop(ts) {
  const dt = Math.min(0.05, (ts - (lastTs || ts)) / 1000); lastTs = ts;
  scene.t += dt;
  try {
    ANCH = {};
    if (scene.mode === 'walk') {
      if (scene.moving && !reduceMotion) scene.scroll += dt * 18;
      if (travelling) { dayAcc += dt * 1000; if (dayAcc >= DAY_MS) { dayAcc = 0; travelDay(); } }
      ambTick(dt, curRegion(), scene.moving); drawWalk(); autoEmote(dt);
    } else if (scene.mode === 'node') { drawNode(); autoEmote(dt); }
    else if (scene.mode === 'river') { drawRiver(); autoEmote(dt * 0.6); }
    else if (scene.mode === 'title') drawTitle();
    else if (scene.mode === 'grave') drawGrave();
    else if (scene.mode === 'store') drawStore();
    else if (scene.mode === 'talk') drawTalk();
    else if (scene.mode === 'arrive') drawArrive();
    else if (scene.mode === 'hunt') { huntUpdate(dt); huntDraw(); }
    else if (scene.mode === 'raft') { raftUpdate(dt); raftDraw(); }
    else if (scene.mode === 'haggle') { haggleUpdate(dt); haggleDraw(); }
    else if (scene.mode === 'show') drawShow();
    else if (scene.mode === 'fire') drawFire();
    else if (scene.mode === 'reunion') drawReunion();
    else if (scene.mode === 'buzk') { buzkUpdate(dt); buzkDraw(); }
  } catch (err) { console.error(err); }
  try { const c = forcedCue || musicCue(); lastCue = c; SND.tick(c); } catch (e) {}
  syncToggles();
  requestAnimationFrame(loop);
}

function monthScreen() {

  screen(`<h2>When do you leave?</h2><p>It’s 1404 and your caravan is in Tabriz. Samarkand is about 400 farsakhs east.</p>`, [

function storeIntro() {

    line: 'Welcome, welcome! Off to Samarkand? Everyone is off to Samarkand. You will need camels. Lots of camels. And wool! Scarlet wool from Flanders, by way of the Genoese. Here it is cheap. In Samarkand they fight over it. Silk? No, no. Silk goes the other way.',
