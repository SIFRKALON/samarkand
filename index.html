/* ---------- store, goods and haggling ---------- */
const ADVICE = {
  camels: 'Each one carries about 400 lb and complains about all of it. Get at least four. They all come with names.',
  food: 'Naan, dried apricots, raisins and qurut (dried yogurt balls, hard as rocks). Plan on about 200 lb per person.',
  coats: 'The plateau is cold at night and the mountains are cold all the time. One per person.',
  bundles: 'For hunting. 20 arrows to a bundle.',
  saddles: 'Packsaddles break. Bring spares, or bring a saddle maker.',
  skins: 'Each holds a day of water for your whole party. Ten is about right.',
  letter: 'A scribe writes down whence you come and whither you go. No letter, no Oxus ferry.',
  rue: 'Wild rue seeds, called isfand. When someone catches the evil eye, you drop a pinch on the coals and wave the crackling smoke around them. Each pouch is one cure.',
  bead: 'A blue glass bead, a nazar. Hang it on a camel and the evil eye mostly looks elsewhere, so your crew catches it far less often. It also cures someone who already has it.',
};
function storeScreen(id, after, haggled) {
  const nd = N[id], m = (nd.store || 1) * (haggled || 1), tabriz = id === 'tabriz';
  setScene('store', { keeper: tabriz ? MIRZA : lookFor('A shopkeeper in ' + nd.name) });
  const pr = { camels: PRICES.camels * m, food: PRICES.food * m, coats: PRICES.coats * m, bundles: PRICES.bundles * m, saddles: PRICES.saddles * m, skins: PRICES.skins * m, letter: (nd.letter || 0), rue: 2 * m, bead: 6 * m };
  const q = { camels: 0, food: 0, coats: 0, bundles: 0, saddles: 0, skins: 0, letter: 0, rue: 0, bead: 0 };
  const rows = [
    ['camels', 'Camels', 1, `${money(pr.camels)} each`, S.camels], ['food', 'Food (lb)', 50, `${money(pr.food)} a pound`, Math.floor(S.food)],
    ['coats', 'Felt coats', 1, `${money(pr.coats)} each`, S.coats], ['bundles', 'Arrows', 1, `${money(pr.bundles)} a bundle`, S.arrows],
    ['saddles', 'Spare packsaddles', 1, `${money(pr.saddles)} each`, S.saddles], ['skins', 'Water skins', 1, `${money(pr.skins)} each`, S.skins],
    ['rue', 'Wild rue', 1, `${money(pr.rue)} a pouch`, S.items.rue || 0], ['bead', 'Blue bead', 1, money(pr.bead), S.items.bead || 0],
  ];
  if (nd.letter && S.letter !== true) rows.push(['letter', 'Travel letter', 1, money(pr.letter), 0]);
  const wares = Object.keys(WARES);
  const goodsHTML = `<h3>Trade goods</h3><p class="dim small">Buy goods where they come from. Sell them farther east for more.</p><div class="store">${wares.map(k => { const W2 = WARES[k], src = id === W2.from; return `<div class="item"><div class="nm">${cap(W2.many)}<br>${src ? `<span class="pr">buy ${money(wareBuy(k, id))}</span> ` : ''}<span class="pr sell">sell ${money(wareSell(k, id))}</span> <span class="dim small">(have <span id="g-${k}">${S.goods[k] || 0}</span>)</span></div><div class="step">${src ? `<button type="button" class="txtb" data-g="${k}" data-a="buy">Buy</button>` : ''}<button type="button" class="txtb" data-g="${k}" data-a="sell">Sell</button></div>${src ? `<div class="adv">${cap(W2.note)}. The local specialty.</div>` : ''}</div>`; }).join('')}</div>`;
  const html = `<div class="eyebrow">${tabriz ? 'Mirza Ali’s stall · Tabriz bazaar' : 'The bazaar at ' + esc(placeName(id))}${haggled ? ' · haggled!' : ''}</div><p class="date">${dateStr(S.day)}</p>
    <div class="store">${rows.map(([k, label, step, price, have]) => `<div class="item"><div class="nm">${label}<br><span class="pr">${price}</span>${!tabriz && k !== 'letter' ? ` <span class="dim small">(have ${have})</span>` : ''}</div><div class="step"><button type="button" data-k="${k}" data-d="-${step}" aria-label="Fewer ${label}">−</button><input id="q-${k}" inputmode="numeric" type="number" min="0" value="0" aria-label="${label}"><button type="button" data-k="${k}" data-d="${step}" aria-label="More ${label}">+</button></div>${tabriz ? `<div class="adv">${ADVICE[k]}</div>` : ''}</div>`).join('')}</div>
    <div class="bill"><span>Total</span><span id="bill">0</span></div><div class="bill"><span class="dim">Your purse</span><span id="have">${money(S.money)}</span></div><p id="storewarn" class="warn" style="min-height:1.2em"></p>${goodsHTML}`;
  const billOf = () => Object.keys(q).reduce((s, k) => s + q[k] * pr[k], 0);
  const leave = () => {
    const total = billOf();
    if (total > S.money + 1e-9) return;
    if (tabriz && S.camels + q.camels <= 0) { $('#storewarn').textContent = plainq('Mirza Ali: “No camels? Who is going to carry everything, the goat?”'); sfx.bad(); return; }
    S.money = Math.round((S.money - total) * 100) / 100;
    addCamels(q.camels); S.food += q.food; S.coats += q.coats; S.arrows += q.bundles * 20; S.saddles += q.saddles; S.skins += q.skins; if (q.letter) S.letter = true;
    S.items.rue = (S.items.rue || 0) + q.rue; S.items.bead = (S.items.bead || 0) + q.bead;
    S.water = S.skins;
    if (total > 0) sfx.coin();
    save();
    if (q.camels && tabriz) return camelIntro(after);
    after();
  };
  const buttons = [{ label: tabriz ? 'Pay and go' : 'Done shopping', primary: true, onClick: leave }];
  if (!haggled) buttons.push({ label: 'Haggle first', sub: 'a little game: better prices if you’re quick', onClick: () => haggleGame(id, mult => storeScreen(id, after, mult)) });
  screen(html, buttons);
  const refresh = () => {
    const total = billOf(); $('#bill').textContent = money(total); $('#have').textContent = money(S.money);
    const over = total > S.money + 1e-9; $('#storewarn').textContent = over ? "You can't afford all that." : '';
    const btn = choicesEl.querySelector('button'); if (btn) btn.disabled = over;
    rows.forEach(([k]) => { const el = $('#q-' + k); if (el && document.activeElement !== el) el.value = q[k]; });
  };
  textEl.querySelectorAll('.step button[data-k]').forEach(b => b.addEventListener('click', () => { const k = b.dataset.k; q[k] = clamp(q[k] + Number(b.dataset.d), 0, k === 'letter' ? 1 : 9999); sfx.tap(); refresh(); }));
  textEl.querySelectorAll('.step button[data-g]').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.g;
    if (b.dataset.a === 'buy') { const p = wareBuy(k, id); if (S.money - billOf() < p) { sfx.bad(); return; } S.money -= p; S.goods[k] = (S.goods[k] || 0) + 1; sfx.coin(); }
    else { if (!S.goods[k]) { sfx.bad(); return; } S.goods[k]--; S.money += wareSell(k, id); sfx.coin(); }
    $('#g-' + k).textContent = S.goods[k] || 0; refresh(); save();
  }));
  rows.forEach(([k]) => { const el = $('#q-' + k); el.addEventListener('input', () => { const v = Math.floor(Number(el.value)); q[k] = clamp(isFinite(v) ? v : 0, 0, k === 'letter' ? 1 : 9999); refresh(); }); el.addEventListener('blur', refresh); });
  refresh();
}
function camelIntro(after) {
  setScene('walk', { moving: false });
  screen(`<h2>Your camels</h2><p>Aybike introduces them one by one. She insists.</p><div class="roster">${S.herd.map(c => `<div class="mem">${camelImg(c)}<div class="n">${esc(c.name)}<span class="bio">${c.bio}</span></div></div>`).join('')}</div>`, [{ label: 'Nice to meet you all', primary: true, onClick: after }]);
}

/* ---------- travel ---------- */
function departTabriz() {
  S.atNode = false; S.segFrom = 'tabriz'; S.segDone = 0;
  setScene('walk');
  screen(`<p class="date">${dateStr(S.day)}</p><h2>Off you go!</h2><p class="big">${tw('Your caravan rolls out of Tabriz by the eastern gate.')}</p><p>${tw('Ahead lie the Persian plateau, the deserts of Khorasan and two big rivers. Someone in the crowd waves. The goat leaves last.')}</p>`,
    [{ label: 'Hit the road', primary: true, onClick: travelScreen }]);
}
const PACES = ['', 'steady', 'strenuous', 'grueling'], RATIONS = ['', 'filling', 'meager', 'bare bones'];
function hudLine() { return `<span><b>${shortDate(S.day)},</b> 1404</span><span>${S.army ? 'with the army' : PACES[S.pace] + ' pace'}</span><span><b>${money(S.money)}</b></span>`; }
function remainingEst() { let id = S.segFrom, rem = 0, first = true, n = 0; while (id !== 'samarkand' && n++ < 40) { const e = edgeOf(id); if (!e) break; rem += first && !S.atNode ? e.len - S.segDone : e.len; first = false; id = e.to; } return Math.max(0, rem); }
function partyStrip() {
  return `<dt class="sr">Your crew</dt><dd class="strip">${S.party.map((m, i) => { const hp = Math.round(m.hp); return `<div class="pm${m.alive ? '' : ' dead'}">${faceImg(i, memberMood(m), m.name)}<span class="hp" role="img" aria-label="${esc(m.name)}: ${m.alive ? healthLabel(hp) + ' health' : 'died'}"><i class="${hp > 60 ? '' : hp > 30 ? 'mid' : 'low'}" style="width:${hp}%"></i></span><span>${esc(m.name)}</span></div>`; }).join('')}</dd>`;
}
function statusHTML() {
  const e = edgeOf(S.segFrom), next = e ? e.to : null;
  const rem = e ? Math.max(0, Math.ceil(e.len - (S.atNode ? 0 : S.segDone))) : 0;
  const hl = healthLabel(avgHp()), left = remainingEst(), pct = Math.round(100 * S.traveled / Math.max(1, S.traveled + left));
  return `<dl class="status">${partyStrip()}
    <dt>Weather</dt><dd>${weatherLabel(S.weather)}${S.nightDays ? ' · traveling by night' : ''}</dd>
    <dt>Health</dt><dd class="${hl === 'good' ? 'good' : hl === 'fair' ? '' : 'warn'}">${hl}</dd>
    <dt>Food</dt><dd>${Math.floor(S.food)} lb${S.food <= 0 ? ' <span class="warn">· none left!</span>' : ''}</dd>
    <dt>Water</dt><dd>${S.skins ? `${S.water.toFixed(1)} of ${S.skins} skins` : '<span class="warn">no water skins</span>'}</dd>
    <dt>Next stop</dt><dd>${next ? `${esc(placeName(next))} · ${plural(rem, 'farsakh')}` : '—'}</dd>
    <dt class="sr">Progress</dt><dd class="prog"><span>Tabriz</span><span class="bar"><i style="width:${pct}%"></i></span><span>Samarkand</span></dd></dl>`;
}
function travelScreen() {
  if (!leader().alive) return gameOver();
  if (S.camels <= 0) return stuckScreen();
  S.atNode = false;
  if (scene.mode !== 'walk') setScene('walk');
  scene.extras = []; scene.moving = true;
  travelling = true; dayAcc = DAY_MS * 0.3;
  screen(statusHTML(), [{ label: 'Size up the situation', primary: true, onClick: () => { travelling = false; scene.moving = false; menuScreen(); } }], { hud: hudLine() });
}
function travelDay() {
  if (chance(0.3)) sfx.bell();
  const res = advanceDay(false);
  if (scene.mode === 'walk') { const st = textEl.querySelector('.status'); if (st) st.outerHTML = statusHTML(); setHud(hudLine()); }
  if (res.items.length || res.arrived) {
    travelling = false; scene.moving = false;
    const then = () => { if (!leader().alive) return gameOver(); if (res.arrived) { S.segDone = 0; return arriveAt(res.to); } travelScreen(); };
    if (res.items.length) beat(res.items, then); else setTimeout(then, reduceMotion ? 0 : 500);
  }
}
function stuckScreen() {
  travelling = false; scene.moving = false;
  screen(`<h2>No camels</h2><p class="big">${tw('You have no camels left, and you can’t carry everything yourselves.')}</p>`, [
    { label: 'Wait for a caravan to pass', primary: true, onClick: () => {
        const res = advanceDay(true);
        runQueue(res.items, () => {
          if (!leader().alive) return gameOver();
          if (chance(0.3)) { const price = 80; return screen(`<p class="date">${dateStr(S.day)} · ${money(S.money)}</p><p class="big">${tw(`A caravan comes by! Its master will sell you a camel for ${money(price)}.`)}</p>`, [
            { label: 'Buy the camel', primary: true, disabled: S.money < price, onClick: () => { S.money -= price; addCamels(1); sfx.coin(); runQueue([msg(`Her name is ${S.herd[S.herd.length - 1].name}. ${S.herd[S.herd.length - 1].bio}`)], travelScreen); } },
            { label: 'Keep waiting', onClick: stuckScreen }]); }
          if (chance(0.06)) { addCamels(1); return runQueue([msg(`A camel with no rider wanders into camp. It seems to like you. Aybike names it ${S.herd[S.herd.length - 1].name}.`)], travelScreen); }
          screen(`<p class="date">${dateStr(S.day)}</p><p class="big">${tw('Nobody comes by today.')}</p>`, [{ label: 'Continue', primary: true, onClick: stuckScreen }]);
        });
      } },
    { label: 'Try to trade', onClick: () => tradeScreen(stuckScreen) },
  ]);
}
function menuScreen() {
  travelling = false;
  if (scene.mode === 'walk') scene.moving = false;
  else if (scene.mode !== 'node') setScene(S.atNode ? 'node' : 'walk', S.atNode ? { node: S.segFrom } : {});
  const at = S.atNode ? N[S.segFrom] : null, id = S.segFrom;
  const opts = [{ label: 'Keep going', primary: true, onClick: () => at ? leaveNode() : travelScreen() }];
  if (at) {
    if (at.hist || at.food || at.sights || FOODS[id] || SHOWS[id]) opts.push({ label: 'Explore', sub: 'sights, history, food and shows', onClick: () => exploreScreen() });
    if (at.talk) opts.push({ label: 'Talk to people', onClick: () => talkScreen() });
    if (at.store) opts.push({ label: 'Shop at the bazaar', onClick: () => storeScreen(id, () => { setScene('node', { node: id }); menuScreen(); }) });
  }
  opts.push({ label: at && at.store ? 'Stay at the caravanserai' : 'Rest', sub: at && at.store ? 'rest in comfort, a few coins a night' : (alive().some(m => m.hp < 50) ? 'your crew could use it' : null), onClick: restScreen });
  if (!at) opts.push({ label: 'Go hunting', sub: `${S.arrows} arrows`, onClick: huntMenu });
  opts.push({ label: 'Supplies and crew', onClick: suppliesScreen });
  opts.push({ label: 'More…', sub: 'map, chat, pace, rations, trade', onClick: moreScreen });
  screen(`<h2>${at ? esc(placeName(id)) : 'By the side of the road'}</h2>${statusHTML()}`, opts, { hud: hudLine() });
}
function moreScreen() {
  screen(`<h2>More</h2>`, [
    { label: 'Chat with the crew', onClick: chatScreen },
    { label: 'Look at the map', onClick: mapScreen },
    { label: 'Change pace', sub: S.army ? 'the army decides' : 'now: ' + PACES[S.pace], onClick: paceScreen },
    { label: 'Change rations', sub: 'now: ' + RATIONS[S.rations], onClick: rationsScreen },
    { label: 'Trade', sub: 'takes a day', onClick: () => tradeScreen(menuScreen) },
    { label: 'Back', primary: true, onClick: menuScreen },
  ], { hud: hudLine() });
}
function hearts(hp) { const n = clamp(Math.ceil(hp / 20), 0, 5); return `<span class="hearts" role="img" aria-label="${healthLabel(hp)} health">${'♥'.repeat(n)}<span class="o">${'♥'.repeat(5 - n)}</span></span>`; }

  const party = S.party.map((m, i) => {
    const st = !m.alive ? 'died on the road' : `${healthLabel(m.hp)} health` + (m.sick ? ` · <span class="warn">${SICK[m.sick].die.replace(/^a /, '')}</span>` : '') + (m.inj ? ` · <span class="warn">${INJ[m.inj].die.replace(/^a /, '')}</span>` : '');
    return `<div class="mem${m.alive ? '' : ' dead'}">${faceImg(i, memberMood(m), m.name)}<div class="n">${esc(m.name)}${m.leader ? ' <span class="badge t">you</span>' : ''}<small>${i ? CREW[i].role + ' · ' : ''}${st}</small>${i ? `<span class="bio">${CREW[i].skill}</span>` : ''}</div>${m.alive ? hearts(m.hp) : ''}</div>`;
  }).join('') + (S.guest ? `<div class="mem">${faceImg('guest', 'happy', 'Davit')}<div class="n">Davit <small>${GUEST.from}</small><span class="bio">${GUEST.bio}</span></div></div>` : '');
  const goods = Object.keys(WARES).filter(k => S.goods[k]).map(k => `${S.goods[k]} ${S.goods[k] === 1 ? WARES[k].one : WARES[k].many}`);
  const wonders = Object.keys(S.wonders).map(k => `<div class="wonder"><b>${WONDERS[k].name}</b>. ${WONDERS[k].desc}</div>`).join('');
  screen(`<h2>Supplies</h2><dl class="cards">
    <dt>Food</dt><dd>${Math.floor(S.food)} lb</dd><dt>Water skins</dt><dd>${S.skins} (${S.water.toFixed(1)} full)</dd><dt>Felt coats</dt><dd>${S.coats}</dd><dt>Arrows</dt><dd>${S.arrows}</dd>
    <dt>Packsaddles</dt><dd>${S.saddles} spare</dd><dt>Travel letter</dt><dd>${S.letter === 'forged' ? 'yes (Yaqub’s)' : S.letter ? 'yes' : '<span class="warn">no</span>'}</dd>
    <dt>Purse</dt><dd>${money(S.money)}</dd>${goods.length ? `<dt>Goods</dt><dd>${listJoin(goods)}</dd>` : ''}${S.items.rue || S.items.bead ? `<dt>Charms</dt><dd>${listJoin([S.items.rue ? plural(S.items.rue, 'pouch', 'pouches') + ' of wild rue' : '', S.items.bead ? plural(S.items.bead, 'blue bead') : ''].filter(Boolean))}<br><span class="dim small">Burn rue when someone catches the evil eye. The bead keeps it away.</span></dd>` : ''}
    ${S.receipts ? `<dt>Receipts</dt><dd>${S.receipts}, from Timur’s officers</dd>` : ''}<dt>Goat</dt><dd>1 (doing great)</dd></dl>
    <h2>Gifts for Timur</h2>${wonders ? `<div class="wonders">${wonders}</div>` : '<p class="dim">Nothing yet. Keep your eyes open.</p>'}
    <h2>Your crew</h2><div class="roster">${party}</div>
    <h2>Your camels</h2><div class="roster">${S.herd.length ? S.herd.map(c => `<div class="mem">${camelImg(c)}<div class="n">${esc(c.name)}<span class="bio">${c.bio}</span></div></div>`).join('') : '<p class="dim">No camels.</p>'}</div>`,
    [{ label: 'Done', primary: true, onClick: menuScreen }]);
}
function chatScreen() {
  const opts = [1, 2, 3, 4].filter(i => S.party[i].alive).map(i => ({ label: S.party[i].name, sub: CREW[i].role, onClick: () => {
    const m = S.party[i], c = CREW[i], reg = S.atNode ? N[S.segFrom].region : (edgeOf(S.segFrom) || {}).region || 'plateau';
    let line = m.sick ? 'I am fine. I am completely fine. Please stop looking at me like that.' : (S.flags['chat' + i] ? c.lines[reg] : c.lines.goal);
    if (line === 'fact') line = pick(CAMEL_FACTS);
    S.flags['chat' + i] = true;
    sayScreen({ who: m.name, look: LOOKS[i], node: S.atNode ? S.segFrom : null, line, buttons: [{ label: 'Talk to someone else', onClick: chatScreen }, { label: 'Done', primary: true, onClick: () => { setScene(S.atNode ? 'node' : 'walk', S.atNode ? { node: S.segFrom } : {}); menuScreen(); } }] });
  } }));
  if (S.guest) opts.push({ label: 'Davit', sub: 'Georgian · looking for his sister', onClick: () => sayScreen({ who: 'Davit', look: GLOOK, line: pick(['Nino cuts tiles. She was always better with her hands than me. I was better at climbing trees. Not useful now.', 'Thank you. I keep saying it. I will keep saying it.', 'In Georgia we have mountains like these, but with more churches and fewer camels.']), buttons: [{ label: 'Talk to someone else', onClick: chatScreen }, { label: 'Done', primary: true, onClick: () => { setScene(S.atNode ? 'node' : 'walk', S.atNode ? { node: S.segFrom } : {}); menuScreen(); } }] }) });
  if (S.camels && has('aybike')) opts.push({ label: 'Ask Aybike about camels', onClick: () => sayScreen({ who: 'Aybike', look: LOOKS[3], line: pick(CAMEL_FACTS), buttons: [{ label: 'Talk to someone else', onClick: chatScreen }, { label: 'Done', primary: true, onClick: () => { setScene(S.atNode ? 'node' : 'walk', S.atNode ? { node: S.segFrom } : {}); menuScreen(); } }] }) });
  opts.push({ label: 'Never mind', onClick: menuScreen });
  screen(`<h2>Chat with the crew</h2><p>Who do you want to talk to?</p>`, opts, { hud: hudLine() });
}
function paceScreen() {
  if (S.army) return leaveArmyPrompt('The army sets the pace, and it doesn’t slow down for you.');
  const d = ['', 'About eight hours a day, with long breaks at the wells. The camels approve.', 'Dawn to dusk. Everyone is tired. Health slowly drops.', 'Up before dawn, walking until dark. Health drops fast. The camels are giving you looks.'];
  screen(`<h2>Pace</h2><p class="dim">Right now: ${PACES[S.pace]}</p>`, [1, 2, 3].map(p => ({ label: cap(PACES[p]), sub: d[p], primary: p === S.pace, onClick: () => { S.pace = p; save(); menuScreen(); } })));
}
function rationsScreen() {
  const d = ['', 'Big meals: naan, apricots, qurut and sometimes a pot of rice.', 'Small meals. Everyone notices.', 'Tiny meals. Everyone is hungry. Even the goat looks worried.'];

}
function leaveArmyPrompt(why) {

  ]);
}
function restScreen() {
  if (S.army) return leaveArmyPrompt('The army does not stop to rest.');
  const inn = S.atNode && N[S.segFrom].store, fee = 3;
  screen(`<h2>${inn ? 'The caravanserai' : 'Rest'}</h2><p class="big">${inn ? `A room, a fire, fodder for the camels and other travelers to talk to: ${money(fee)} a night. Or camp outside the walls for free.` : 'How many days do you want to rest?'}</p><p class="dim">${S.party.filter(m => m.alive && m.hp < 60).length ? 'Some of your crew could really use it.' : 'Everyone is holding up, for now.'}</p>`,
    [1, 2, 3, 5].map(n => ({ label: plural(n, inn ? 'night' : 'day'), sub: inn ? money(n * fee) : null, disabled: inn && S.money < n * fee, onClick: () => doRest(n, inn) })).concat(inn ? [{ label: 'Camp outside for a night', sub: 'free', onClick: () => doRest(1, false) }] : []).concat([{ label: 'Never mind', onClick: menuScreen }]));
}
function doRest(n, inn) {
  if (inn) S.money -= n * 3;
  const items = [];
  for (let i = 0; i < n; i++) { const r = advanceDay(true); if (inn) alive().forEach(m => m.hp = Math.min(100, m.hp + 2)); items.push(...r.items); if (!leader().alive) break; }
  items.unshift(msg(inn ? `You rest at the caravanserai for ${plural(n, 'night')}. Clean water, a roof, and somebody else’s cooking.` : `You rest for ${plural(n, 'day')}. Everyone puts their feet up.`));
  if (inn && S.legends < LEGENDS.length && chance(0.5)) items.push(legendItem(unheard()[0], 'At the fire, a traveler from far away tells a story.'));
  runQueue(items, () => leader().alive ? menuScreen() : gameOver());
}
const GOODS = { food: ['pound of food', 'pounds of food', 0.15], coats: ['felt coat', 'felt coats', 10], arrows: ['arrow', 'arrows', 0.1], camels: ['camel', 'camels', 40], saddles: ['spare packsaddle', 'spare packsaddles', 10], skins: ['water skin', 'water skins', 4] };
const gq = (k, n) => `${n} ${n === 1 ? GOODS[k][0] : GOODS[k][1]}`;
function makeOffer() {
  const keys = Object.keys(GOODS);
  for (let tries = 0; tries < 30; tries++) {
    const want = pick(keys), give = pick(keys);
    if (want === give || S[want] <= 0) continue;
    let wq = want === 'food' ? ri(3, 10) * 10 : want === 'arrows' ? ri(1, 3) * 20 : ri(1, want === 'camels' ? 1 : 3);
    if (want === 'camels' && S.camels <= 1) continue;
    wq = Math.min(wq, Math.floor(S[want])); if (wq <= 0) continue;
    const val = wq * GOODS[want][2] * rnd(0.5, 0.92);
    let n = Math.max(1, Math.floor(val / GOODS[give][2]));
    if (give === 'food' || give === 'arrows') n = Math.max(10, Math.floor(n / 10) * 10);
    if (give === 'camels' && n > 1) continue;
    return { want, wq, give, gq: n, who: pick(TRADERS), crook: chance(0.12) };
  }
  return null;
}
function tradeScreen(back, free) {
  if (!free) loseDays(1);
  const o = chance(0.85) ? makeOffer() : null;
  if (!o) return screen(`<p class="date">${dateStr(S.day)}</p><p class="big">${tw('You spend the whole day looking for someone to trade with. Nobody wants to trade today.')}</p>`, [{ label: 'Continue', primary: true, onClick: back }]);
  screen(`<p class="date">${dateStr(S.day)}</p><h2>A trade offer</h2><p class="big">${tw(`${o.who} offers you ${gq(o.give, o.gq)} for ${gq(o.want, o.wq)}.`)}</p><p class="dim">You have ${gq(o.want, Math.floor(S[o.want]))}.</p>`, [
    { label: 'Deal!', primary: true, onClick: () => {
      if (o.want === 'camels') loseCamels(o.wq); else S[o.want] -= o.wq;
      let note = 'It’s a deal. Everyone shakes hands.';
      if (o.crook) { const got = Math.max(o.give === 'camels' ? 0 : 1, Math.floor(o.gq / 2)); note = o.give === 'camels' ? 'The camel turns out to belong to someone else, who comes to collect it that night.' : `Later you count what you got. It is only ${gq(o.give, got)}. The trader is long gone.`; if (o.give !== 'camels') S[o.give] += got; sfx.bad(); }
      else { if (o.give === 'camels') addCamels(o.gq); else S[o.give] += o.gq; sfx.coin(); }
      if (o.want === 'skins' || o.give === 'skins') S.water = Math.min(S.water, S.skins);
      save(); runQueue([msg(note, { date: false })], back);
    } },
    { label: 'No thanks', onClick: back },
  ]);
}

/* ---------- talking to people ---------- */
function talkScreen(i) {

  if (nd.road) b.push({ label: 'Ask about the road ahead', onClick: () => roadTalk() });
  if (nd.talk.length > 1) b.push({ label: 'Talk to someone else', onClick: () => talkScreen() });
  b.push({ label: 'Goodbye', primary: !more, onClick: back });
  sayScreen({ who: person, line, node: S.segFrom, buttons: b });
}
function talkMore(i) {
  const nd = N[S.segFrom], [person, , more, extra] = nd.talk[i];
  const back = () => talkScreen(i);
  if (more.startsWith('legend:')) { const L = LEGENDS[+more.slice(7)]; S.heard[L.t] = true; S.legends = Object.keys(S.heard).length; if (L.flag) S.flags[L.flag] = true; return sayScreen({ who: person, line: L.s, node: S.segFrom, before: `<h3>${L.t}</h3>`, buttons: [{ label: 'Thank them', primary: true, onClick: () => talkScreen() }] }); }
  if (extra && extra.flag) S.flags[extra.flag] = true;

  if (extra && extra.wonder && !S.wonders[extra.wonder]) b.push({ label: extra.label, sub: money(extra.cost) + ` · you have ${money(S.money)}`, primary: true, disabled: S.money < extra.cost, onClick: () => { S.money -= extra.cost; runQueue([getWonder(extra.wonder, `${person} wraps it up for you with great care.`)], () => talkScreen(i)); } });
  b.push({ label: 'Talk to someone else', onClick: () => talkScreen() });
  b.push({ label: 'Goodbye', onClick: () => { setScene('node', { node: S.segFrom }); menuScreen(); } });
  sayScreen({ who: person, line: more, node: S.segFrom, buttons: b });
}
function roadTalk() {

/* ---------- arriving at places ---------- */
function arriveAt(id) {
  S.segFrom = id; S.segDone = 0; S.atNode = true;
  if (!S.visited.includes(id)) S.visited.push(id);
  if (S.skins) S.water = S.skins;
  sfx.arrive(); save();
  if (id === 'samarkand') return arrivalSamarkand();
  if (N[id].kind === 'river') return riverArrive(id);
  const pre = [];
  if (S.flags.shrineCure && N[id].kind === 'town') { const m = S.party.find(p => p.name === S.flags.shrineCure && p.alive); S.flags.shrineCure = null; if (m && m.sick) pre.push(cureMsg(m, 'At the town shrine, {n} sits by the tomb for an hour and comes out yawning. The jinn has gone.')); }
  if (id === 'nishapur' && S.army) { S.army = false; pre.push(msg('Near Nishapur the army turns off toward its summer pastures. An officer tells you the road ahead is all yours. You’re not sure he meant it kindly.', { scene: { mode: 'node', node: id } })); }
  pre.push(...beatsFor(id));
  if (pre.length) return runQueue(pre, () => landmarkScreen(id));
  landmarkScreen(id);
}
function landmarkScreen(id) {
  setScene('node', { node: id });
  const nd = N[id];
  setTimeout(() => { if (scene.mode === 'node') emote('p0', 'sparkle'); }, 500);
  screen(`<p class="date">${dateStr(S.day)}</p><h2>${esc(placeName(id))}</h2><p class="big">${tw(`You’ve reached ${nd.name}!`)}</p>`, [
    { label: 'Look around', primary: true, onClick: () => exploreScreen() },
    { label: 'Not now', onClick: menuScreen },
  ]);
}
function leaveNode() {
  const id = S.segFrom;
  setScene('node', { node: id });
  if (id === 'sultaniyya' && !S.flags.davit) return davitScene();
  if (id === 'sultaniyya' && !S.armyAsked) {
    S.armyAsked = true;
    if (S.day <= ARMY_LAST) return screen(`<h2>Timur’s army!</h2><p class="big">${tw('Outside Sultaniyya, Timur’s army is camped on the meadows, heading home to Samarkand after five years of war.')}</p><p>${tw('An officer says merchants may follow the baggage train. Bandits won’t bother you. Nobody will. But the army moves fast, never stops for you, and takes whatever it needs.')}</p>`, [
      { label: 'Follow the army', primary: true, onClick: () => { S.army = true; S.armyWent = true; save(); runQueue([msg('You fall in behind the baggage train. The dust is tremendous. Otabek is beside himself: elephants!', { scene: { mode: 'walk', extras: ['elephant'] }, who: 'p2', emo: 'heart' })], travelScreen); } },
      { label: 'Stick to the caravan road', onClick: () => travelScreen() },
    ]);
    return runQueue([msg('The meadows outside town are flattened and full of tent-peg holes. Timur’s army left for Samarkand weeks ago. You have the road to yourself.')], travelScreen);
  }
  if (id === 'mashhad' && !S.route) return routeChoice();
  travelScreen();
}

    before: `<p class="date">${dateStr(S.day)} · ${money(S.money)}</p><p>${tw('On your way out through the bazaar you pass the slave market. A dealer is selling captives from Timur’s raids on Georgia. One of them, a boy about Otabek’s age, asks where you are going. When you say Samarkand, he grabs your sleeve.')}</p>`,
    line: 'My sister Nino is in Samarkand. They took her to cut tiles for the new mosque. Please. I just want to find her.',
    buttons: [
      { label: 'Buy his freedom', sub: `${money(price)} · you have ${money(S.money)}`, primary: true, disabled: S.money < price, onClick: () => { S.money -= price; S.guest = 'Davit'; save(); runQueue([msg(`${has('yaqub') ? 'Yaqub writes out a letter of freedom in his finest hand, and makes the dealer sign it twice.' : 'The dealer writes out a letter of freedom and takes your money.'} Davit reads it three times. Then he asks if he can walk with you to Samarkand. Otabek has already given him half his bread.`, { title: 'Davit', sound: 'sparkle', who: 'p2', emo: 'heart' })], () => leaveNode()); } },

      { label: 'Walk on', onClick: () => runQueue([msg('You walk on. Behind you, the dealer starts calling out prices again.')], () => leaveNode()) },
    ] });
}

/* ---------- v4: more history, travelers and Timur ---------- */
N.sultaniyya.hist += ' A century earlier, Marco Polo came through Tabriz, where your trip began, and called it a great city where merchants came from India, Baghdad, Mosul and Hormuz, and where Latin merchants bought goods from strange lands.';
N.ordu.hist += ' Timur’s wars were some of the bloodiest in history. After Isfahan rebelled in 1387, each of his soldiers had to bring in a quota of heads. Chroniclers counted about seventy thousand, piled into towers outside the walls. Before the battle for Delhi in 1398, he had perhaps a hundred thousand prisoners killed in a single day, so they could not rise up behind his army. At Baghdad in 1401, each soldier owed him two heads, and there were a hundred and twenty towers. Some historians guess his wars killed seventeen million people, about one in every twenty people alive.';
N.damghan.hist += ' Timur built towers like these all over his empire. They were cruel, and they were also advertising: every merchant who passed them carried the story on to the next town.';
N.nishapur.hist += ' A century later the traveler Ibn Battuta, from Morocco, found Nishapur rebuilt and lovely, full of orchards and streams, and called it Little Damascus. He bought silk and velvet here to send home.';
N.balkh.hist += ' Marco Polo passed by around 1273 and wrote that Balkh had once been a noble city of marble palaces, all ruined by the Tartars. Ibn Battuta came sixty years later and found it still empty: a city of ruins, with nobody living in it.';
N.merv.hist += ' Just before the end, the geographer Yaqut spent three happy years in Merv’s ten great libraries, where he could borrow two hundred books at a time without paying a deposit. He escaped the Mongols with his notes and spent the rest of his life missing it.';
N.bukhara.hist += ' When Ibn Battuta visited in 1333, most of its mosques, colleges and markets were still in ruins from the Mongols, and he complained that nobody left there knew anything about learning.';
N.kesh.hist += ' Arrow wounds left him lame in his right leg and arm, so the Persians called him Timur-i Lang, Timur the Lame, which Europeans turned into Tamerlane. He probably could not read, but he loved history and chess, and outside burning Damascus in 1401 he spent weeks arguing with the great historian Ibn Khaldun, who found him fascinating and terrifying in about equal parts. Clavijo, the Castilian ambassador, saw this palace in 1404 and said its tilework was the finest in the world.';
N.kesh.legend = 'People say that when Timur took Shiraz, he sent for the poet Hafez. “I have conquered half the world to make Samarkand and Bukhara beautiful,” he said, “and you would give them both away for a mole on a girl’s cheek?” Hafez bowed and showed him his ragged robe. “Sire, it is because of generosity like that that I am now so poor.” Timur laughed and gave him a robe of honor. It probably never happened. Everyone tells it anyway.';
const OXUS_NOTE = 'This is the Oxus, the river the Persians call the Jayhun and the Turks the Amu. For a thousand years it has been the line between Iran and Turan, between the Persian world and the Turkish one. Everything on the far side, the Arabs simply call Mawarannahr: what lies beyond the river. Timur’s officers watch every ferry.';
const SAMARKAND_HIST = 'Samarkand is older than Rome. Alexander the Great took it in 329 BC, when it was called Marakanda, and is said to have found it even more beautiful than he had heard. Chinese prisoners taught it to make paper in 751. Genghis Khan wrecked it in 1220. Ibn Battuta came through in 1333 and still called it one of the greatest and most beautiful cities in the world, with orchards along the river and its old palaces in ruins.<br><br>Then Timur made it his capital and filled it with the riches and the people of half of Asia. He named the villages around it Baghdad, Damascus, Cairo, Shiraz and Sultaniyya, after cities he had beaten, so everyone would know which was greatest. The price of all this beauty was paid in towers of skulls: seventy thousand heads at Isfahan, a hundred thousand prisoners killed outside Delhi, a hundred and twenty towers at Baghdad. Weavers from Damascus, stonecutters from Delhi and tile makers from Tabriz were marched here to build it.<br><br>A few months after the feast, Timur set out to conquer China. He died on the way, in February 1405, in the snow at Otrar. His blue-ribbed tomb, the Gur-i Amir, still stands in Samarkand.';
