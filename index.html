<title>The Samarkand Trail</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Gaegu:wght@700&family=Silkscreen&display=swap">
<style>
/* One committed look: a riso-printed handheld. Paper, navy ink, pink/blue/yellow plus Timurid turquoise. */
:root{
  --paper:#FFF8EF;
  --card:#FFFFFF;
  --navy:#26275F;
  --ink2:#5F5B8C;
  --pink:#FF4FA3;
  --pink2:#FFD3E8;
  --blue:#1F7FD0;
  --blue2:#CDEBFF;
  --yellow:#FFE14A;
  --turq:#0FA899;
  --turq2:#C4F3EA;
  --coral:#EE3D63;
  --lav:#E3DBFF;
  --display:"Bagel Fat One","Arial Black",system-ui,sans-serif;
  --hand:Gaegu,"Comic Sans MS","Chalkboard SE",cursive;
  --pix:Silkscreen,"Courier New",monospace;
  color-scheme:light;
}
html,body{min-height:100%}
body{margin:0;background-color:var(--paper);background-image:radial-gradient(rgba(255,79,163,.14) 1.1px,transparent 1.6px);background-size:12px 12px;color:var(--navy);font-family:var(--hand);font-weight:700;font-size:22px;line-height:1.25;-webkit-text-size-adjust:100%}
#app{box-sizing:border-box;max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;gap:16px;padding-block:14px 44px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen{position:relative;border:3px solid var(--navy);border-radius:12px;overflow:hidden;background:#BFE4FF;box-shadow:5px 5px 0 var(--pink)}
#scene{display:block;width:100%;height:auto;aspect-ratio:16/9;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;-webkit-user-select:none;user-select:none}
.tog{position:absolute;top:6px;right:6px;display:flex;gap:6px;z-index:2}
.tog button{width:34px;height:34px;display:grid;place-items:center;padding:0;border-radius:50%;border:2px solid var(--navy);background:var(--card);color:var(--navy);box-shadow:2px 2px 0 var(--navy);cursor:pointer;touch-action:manipulation}
.tog button svg{width:18px;height:18px;display:block}
.tog button[aria-pressed="false"]{background:var(--lav);color:var(--ink2)}
.tog button[aria-pressed="true"] .x{display:none}
#hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:2px 12px;padding:5px 12px 6px;background:var(--navy);color:#fff;font-family:var(--pix);font-weight:400;font-size:13px;letter-spacing:.02em;font-variant-numeric:tabular-nums;border-top:3px solid var(--navy)}
#hud b{color:var(--yellow);font-weight:400}
#hud .good{color:#7FF0DF}
#hud .warn{color:#FFA3CB}
#text{min-height:3.2em;overflow-wrap:anywhere}
#text p{margin:0 0 .55em}
#text h1{font-family:var(--display);font-weight:400;font-size:clamp(42px,11.5vw,62px);line-height:.92;margin:.08em 0 .22em;color:var(--pink);text-shadow:-3px -2px 0 rgba(31,127,208,.85);text-wrap:balance}
#text h2{font-family:var(--display);font-weight:400;font-size:30px;line-height:1;margin:.1em 0 .45em;color:var(--pink);text-shadow:-2px -1.5px 0 rgba(31,127,208,.75);text-wrap:balance}
.eyebrow,.date{font-family:var(--pix);font-weight:400;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin:0 0 .45em!important}
.date{color:var(--ink2);letter-spacing:.04em}
.dim{color:var(--ink2)}
.big{font-size:27px;line-height:1.15}
.warn{color:var(--coral)}
.good{color:var(--turq)}
.small{font-size:19px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.anim{animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
#choices{display:flex;flex-direction:column;gap:10px}
#choices button{font:inherit;font-size:23px;line-height:1.12;text-align:left;color:var(--navy);background:var(--card);border:2.5px solid var(--navy);border-radius:14px;padding:9px 14px;cursor:pointer;display:flex;gap:12px;align-items:center;box-shadow:3px 3px 0 var(--navy);transition:transform .08s,box-shadow .08s;touch-action:manipulation}
#choices button .k{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--yellow);border:2px solid var(--navy);font-family:var(--pix);font-size:14px;font-weight:400;color:var(--navy)}
#choices button .lb{min-width:0}
#choices button .sub{display:block;font-size:18px;color:var(--ink2);margin-top:2px}
#choices button:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--navy)}
#choices button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--navy)}
#choices button.primary{background:var(--pink);color:#fff}
#choices button.primary .sub{color:#FFE3F0}
#choices button.primary .k{background:#fff}
#choices.one button{justify-content:center;text-align:center;border-radius:999px;font-family:var(--display);font-weight:400;font-size:25px;padding:11px 22px;box-shadow:4px 4px 0 var(--navy)}
#choices button[disabled]{opacity:.5;cursor:not-allowed;box-shadow:none;transform:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
input.txt{box-sizing:border-box;width:100%;font:inherit;font-size:25px;background:var(--card);color:var(--navy);border:2.5px solid var(--navy);border-radius:12px;padding:6px 12px;margin:2px 0;box-shadow:3px 3px 0 var(--blue2)}
input.txt::placeholder{color:#A9A4CC}
.names{display:flex;flex-direction:column;gap:10px;margin-top:.3em}
.nrow{display:flex;align-items:center;gap:10px}
.face{width:42px;height:39px;flex:none;image-rendering:pixelated;image-rendering:crisp-edges;background:var(--blue2);border:2px solid var(--navy);border-radius:10px}
.status{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:0;padding:12px 14px;background:var(--card);border:2.5px solid var(--navy);border-radius:14px;box-shadow:3px 3px 0 var(--turq);font-size:21px;font-variant-numeric:tabular-nums}
.status dt{font-family:var(--pix);font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);padding-top:5px}
.status dd{margin:0}
.prog{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin-top:6px;font-family:var(--pix);font-size:11px;letter-spacing:.02em;text-transform:uppercase;color:var(--ink2)}
.prog .bar{flex:1;height:12px;border:2px solid var(--navy);border-radius:999px;background:var(--pink2);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--pink)}
.say{position:relative;background:var(--card);border:2.5px solid var(--navy);border-radius:20px 24px 22px 18px/18px 22px 20px 24px;padding:10px 16px 12px;margin:12px 0 12px;box-shadow:4px 4px 0 var(--turq)}
.say::before{content:"";position:absolute;left:34px;top:-15px;width:20px;height:15px;background:var(--navy);clip-path:polygon(0 100%,30% 0,100% 100%)}
.say::after{content:"";position:absolute;left:38px;top:-9px;width:13px;height:10px;background:var(--card);clip-path:polygon(0 100%,30% 0,100% 100%)}
.say .nm{display:inline-block;font-family:var(--pix);font-weight:400;font-size:12px;letter-spacing:.03em;text-transform:uppercase;background:var(--yellow);border:2px solid var(--navy);border-radius:999px;padding:1px 10px;margin:0 0 6px}
.say p{margin:0!important;font-size:25px;line-height:1.2;min-height:1.2em}
.say .rest{visibility:hidden}
.store{display:flex;flex-direction:column;gap:10px;margin:.3em 0 .7em}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:9px 12px;background:var(--card);border:2.5px solid var(--navy);border-radius:14px}
.item .nm{font-size:23px;line-height:1.05;min-width:0}
.item .pr{display:inline-block;margin-top:4px;font-family:var(--pix);font-weight:400;font-size:11px;letter-spacing:.02em;background:var(--yellow);border:1.5px solid var(--navy);border-radius:999px;padding:0 8px}
.item .adv{grid-column:1/-1;color:var(--ink2);font-size:18px;line-height:1.15;margin-top:5px}
.step{display:flex;align-items:center;gap:5px}
.step button{font-family:var(--display);font-size:22px;line-height:1;width:38px;height:38px;border-radius:50%;background:var(--turq2);color:var(--navy);border:2px solid var(--navy);box-shadow:2px 2px 0 var(--navy);cursor:pointer;padding:0;touch-action:manipulation}
.step button:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--navy)}
.step input{box-sizing:border-box;width:60px;height:38px;border-radius:10px;font-family:var(--pix);font-size:15px;text-align:center;background:var(--paper);color:var(--navy);border:2px solid var(--navy);-moz-appearance:textfield;appearance:textfield}
.step input::-webkit-inner-spin-button,.step input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.bill{display:flex;justify-content:space-between;gap:10px;font-size:24px;padding:6px 4px;border-top:2.5px dashed var(--pink);font-variant-numeric:tabular-nums}
.bill+.bill{border-top:none;padding-top:0}
.map svg{box-sizing:border-box;display:block;width:100%;height:auto;background:#FFF1DE;border:2.5px solid var(--navy);border-radius:14px;box-shadow:3px 3px 0 var(--blue2)}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:19px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:20px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px;background:var(--pink)}
.legend i.todo{background:repeating-linear-gradient(90deg,#8E89B8 0 4px,transparent 4px 7px)}
.legend b{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--yellow);border:2px solid var(--navy);vertical-align:-1px;margin-right:6px}
table.score{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:21px}
table.score td{padding:4px 0;border-bottom:2px dashed var(--pink2)}
table.score td:last-child{text-align:right;color:var(--blue);white-space:nowrap;padding-left:10px;font-family:var(--pix);font-size:14px}
table.score tr.total td{border-bottom:none;font-family:var(--display);font-weight:400;font-size:28px;padding-top:8px;color:var(--pink)}
table.score tr.hl td{background:var(--yellow)}
table.score .rk{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--turq2);border:2px solid var(--navy);font-family:var(--pix);font-size:12px;margin-right:8px;vertical-align:1px}
.roster{display:flex;flex-direction:column;gap:8px}
.mem{display:flex;align-items:center;gap:10px;padding:5px 10px 5px 6px;background:var(--card);border:2px solid var(--navy);border-radius:14px}
.mem .face{border:none;width:42px;height:39px;border-radius:9px}
.mem .n{flex:1;min-width:0;line-height:1.05}
.mem .n small{display:block;font-size:17px;color:var(--ink2)}
.hearts{color:var(--pink);font-size:18px;white-space:nowrap;letter-spacing:1px}
.hearts .o{color:var(--pink2)}
.mem.dead{background:var(--lav)}
.cards{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;padding:12px 14px;background:var(--card);border:2.5px solid var(--navy);border-radius:14px;margin:0 0 .8em;font-size:21px}
.cards dt{font-family:var(--pix);font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);padding-top:5px}
.cards dd{margin:0}
.tomb{box-sizing:border-box;margin:.5em auto .9em;max-width:290px;text-align:center;background:#EDE8FF;border:3px solid var(--navy);border-radius:140px 140px 14px 14px;padding:28px 18px 16px;box-shadow:4px 4px 0 #C9BEFF}
.tomb .rip{font-family:var(--pix);font-size:12px;letter-spacing:.2em;color:var(--ink2)}
.tomb .here{font-family:var(--display);font-size:27px;line-height:1.05;color:var(--navy);margin:.2em 0 .1em}
.tomb .epi{color:var(--ink2);font-size:21px;margin:.2em 0 0!important}
.badge{display:inline-block;font-family:var(--pix);font-weight:400;font-size:11px;letter-spacing:.03em;text-transform:uppercase;padding:2px 9px;border:2px solid var(--navy);border-radius:999px;background:var(--yellow);vertical-align:2px;white-space:nowrap}
.badge.m{background:var(--pink);color:#fff}
.badge.t{background:var(--turq2)}
.badges{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:.8em;align-items:center;font-size:18px;color:var(--ink2)}
.callout{background:var(--yellow);border:2.5px solid var(--navy);border-radius:14px;padding:8px 14px;margin:.2em 0 .7em;box-shadow:3px 3px 0 var(--pink)}
.callout p{margin:0!important}
@media (prefers-reduced-motion:reduce){.anim{animation:none}#choices button,#choices button:hover,#choices button:active{transform:none}}
</style>

<main id="app">
  <div class="screen">
    <canvas id="scene" width="240" height="135" aria-label="Game scene"></canvas>
    <div class="tog">
      <button type="button" id="musBtn" aria-label="Music" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 17.2a3.2 3.2 0 1 1-2-2.96V5.2l11-2.2v11.6a3.2 3.2 0 1 1-2-2.96V7.4l-7 1.4z" fill="currentColor"/><line class="x" x1="3" y1="3.5" x2="21" y2="20.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button>
      <button type="button" id="sfxBtn" aria-label="Sound effects" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 9h4l5-4.2v14.4l-5-4.2h-4z" fill="currentColor"/><path d="M16 8.6a4.8 4.8 0 0 1 0 6.8M18.6 6a8.4 8.4 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><line class="x" x1="3" y1="3.5" x2="21" y2="20.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button>
    </div>
    <div id="hud" hidden></div>
  </div>
  <section id="text" aria-live="polite"></section>
  <div id="choices"></div>
</main>

<script>
(() => {
'use strict';

/* ---------- basics ---------- */
const $ = s => document.querySelector(s);
const textEl = $('#text'), choicesEl = $('#choices'), hudEl = $('#hud');
const cv = $('#scene');
let g = cv.getContext('2d');
const W = 240, H = 135;
g.imageSmoothingEnabled = false;
const reduceMotion = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();
let DAY_MS = 900;

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const KEY = { save: 'samarkand-trail-save-v1', top: 'samarkand-trail-top-v1', graves: 'samarkand-trail-graves-v1', sound: 'samarkand-trail-sound', music: 'samarkand-trail-music' };

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const chance = p => Math.random() < p;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const weighted = obj => { const e = Object.entries(obj).filter(([, w]) => w > 0); const t = e.reduce((s, [, w]) => s + w, 0); let r = Math.random() * t; for (const [k, w] of e) { r -= w; if (r <= 0) return k; } return e.length ? e[e.length - 1][0] : null; };
const hash = n => { let x = Math.imul((n | 0) ^ 0x9e3779b9, 0x85ebca6b); x ^= x >>> 13; x = Math.imul(x, 0xc2b2ae35); x ^= x >>> 16; return (x >>> 0) / 4294967295; };
const strHash = s => { let h = 7; for (let i = 0; i < s.length; i++) h = (Math.imul(h, 31) + s.charCodeAt(i)) | 0; return h; };
const listJoin = a => a.length <= 1 ? (a[0] || '') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];
const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + 's')}`;
const money = n => `${(Math.round(n * 100) / 100).toLocaleString('en-US', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 })} tangas`;

/* ---------- dates (1404, Gregorian, like Clavijo) ---------- */
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const EPOCH = Date.UTC(1404, 0, 1);
const dayOf = (m, d) => Math.round((Date.UTC(1404, m, d) - EPOCH) / 864e5);
const toDate = day => new Date(EPOCH + day * 864e5);
const dateStr = day => { const d = toDate(day); return `${MONTHS[d.getUTCMonth()]} ${d.getUTCDate()}, ${d.getUTCFullYear()}`; };
const shortDate = day => { const d = toDate(day); return `${MONTHS[d.getUTCMonth()].slice(0, 3)} ${d.getUTCDate()}`; };
const monthOf = day => toDate(day).getUTCMonth();
const ARMY_LAST = dayOf(5, 10);
const FEAST_START = dayOf(8, 8), FEAST_END = dayOf(10, 27);

/* ---------- sound: a small WebAudio band (music box, tar, ney flute, frame drums, camel bells) ---------- */
const SND = (() => {
  let ac = null, out, busM, busF, revM, revF, dly, noiseBuf;
  let music = store.get(KEY.music, true), fx = store.get(KEY.sound, true);
  let cueName = null, cue = null, step = 0, nextTime = 0, key = 62, errLogged = false;
  const MUSIC_VOL = 0.42;
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  function impulse(sec) { const len = ac.sampleRate * sec | 0, b = ac.createBuffer(2, len, ac.sampleRate); for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); } return b; }
  function init() {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
    try { ac = new AC(); } catch (e) { ac = null; return false; }
    const comp = ac.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 4;
    const tone = ac.createBiquadFilter(); tone.type = 'lowpass'; tone.frequency.value = 8000;
    out = ac.createGain(); out.gain.value = 0.9; out.connect(tone); tone.connect(comp); comp.connect(ac.destination);
    busM = ac.createGain(); busM.gain.value = music ? MUSIC_VOL : 0; busM.connect(out);
    busF = ac.createGain(); busF.gain.value = 1.15; busF.connect(out);
    const ir = impulse(2.2);
    revM = ac.createConvolver(); revM.buffer = ir; const rgm = ac.createGain(); rgm.gain.value = 0.4; revM.connect(rgm); rgm.connect(busM);
    revF = ac.createConvolver(); revF.buffer = ir; const rgf = ac.createGain(); rgf.gain.value = 0.3; revF.connect(rgf); rgf.connect(busF);
    dly = ac.createDelay(1); dly.delayTime.value = 0.33; const fb = ac.createGain(); fb.gain.value = 0.3; const dl = ac.createBiquadFilter(); dl.type = 'lowpass'; dl.frequency.value = 2400; dly.connect(dl); dl.connect(fb); fb.connect(dly); const dg = ac.createGain(); dg.gain.value = 0.45; dl.connect(dg); dg.connect(busM);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate); { const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    return true;
  }
  function tone(t, o) {
    const { f, type = 'sine', a = 0.005, d = 0.4, peak = 0.2, dur = 0, rel = 0.1, cut = 0, q = 0.7, to = 0, glide = 0.1, detune = 0, send = 0.2, echo = 0, pan = 0, vib = 0, fx: isFx = false } = o;
    const osc = ac.createOscillator(); osc.type = type; osc.frequency.setValueAtTime(f, t);
    if (to) osc.frequency.exponentialRampToValueAtTime(to, t + glide);
    osc.detune.value = detune;
    let lfo = null;
    if (vib) { lfo = ac.createOscillator(); lfo.frequency.value = 5.3; const lg = ac.createGain(); lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(vib, t + Math.min(0.35, (dur || d) * 0.6) + 0.01); lfo.connect(lg); lg.connect(osc.detune); lfo.start(t); }
    const gn = ac.createGain(); gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(peak, t + a); let end;
    if (dur) { gn.gain.setTargetAtTime(peak * 0.6, t + a, d * 0.5); gn.gain.setTargetAtTime(0, t + dur, rel); end = t + dur + rel * 6; }
    else { gn.gain.exponentialRampToValueAtTime(0.0001, t + a + d); end = t + a + d + 0.05; }
    let node = osc; if (cut) { const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = cut; fl.Q.value = q; osc.connect(fl); node = fl; }
    node.connect(gn);
    let dest = gn; if (pan && ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.value = pan; gn.connect(p); dest = p; }
    dest.connect(isFx ? busF : busM);

  if (!reduceMotion) for (const el of [textEl, choicesEl]) { el.classList.remove('anim'); void el.offsetWidth; el.classList.add('anim'); }

/* ---------- main loop ---------- */
let lastCue = 'title', forcedCue = null;
function musicCue() {
  switch (scene.mode) {
    case 'title': return 'title';
    case 'store': return 'store';
    case 'walk': return S && S.army ? 'army' : curRegion();
    case 'node': return N[scene.node] && N[scene.node].army ? 'army' : 'town';
    case 'river': return 'river';
    case 'hunt': return 'hunt';
    case 'raft': return 'raft';
    case 'grave': return 'grave';
    case 'arrive': return scene.late ? 'late' : 'feast';
  }
  return lastCue;
}
function loop(ts) {
  const dt = Math.min(0.05, (ts - (lastTs || ts)) / 1000); lastTs = ts;
  scene.t += dt;
  try {
    ANCH = {};
    if (scene.mode === 'walk') {
      if (scene.moving && !reduceMotion) scene.scroll += dt * 22;
      if (travelling) { dayAcc += dt * 1000; if (dayAcc >= DAY_MS) { dayAcc = 0; travelDay(); } }
      drawWalk(); autoEmote(dt);
    } else if (scene.mode === 'node') { drawNode(); autoEmote(dt); }
    else if (scene.mode === 'river') { drawRiver(); autoEmote(dt * 0.6); }
    else if (scene.mode === 'title') drawTitle();
    else if (scene.mode === 'grave') drawGrave();
    else if (scene.mode === 'store') drawStore();
    else if (scene.mode === 'talk') drawTalk();
    else if (scene.mode === 'arrive') drawArrive();
    else if (scene.mode === 'hunt') { huntUpdate(dt); huntDraw(); }
    else if (scene.mode === 'raft') { raftUpdate(dt); raftDraw(); }
  } catch (err) { console.error(err); }
  try { const c = forcedCue || musicCue(); lastCue = c; SND.tick(c); } catch (e) {}
  requestAnimationFrame(loop);
}

    if (tabriz && S.camels + q.camels <= 0) { $('#storewarn').textContent = plainq('Mirza Ali: “No camels? Who is going to carry everything, the goat?”'); sfx.bad(); scene.talking = true; setTimeout(() => { scene.talking = false; }, 900); return; }
    S.money = Math.round((S.money - total) * 100) / 100;
    S.camels += q.camels; S.food += q.food; S.coats += q.coats; S.arrows += q.bundles * 20; S.saddles += q.saddles; S.skins += q.skins; if (q.letter) S.letter = true;
    S.water = S.skins;
    if (total > 0) sfx.coin();
    save(); after();
  };
  screen(html, [{ label: tabriz ? 'Pay and go' : 'Done shopping', primary: true, onClick: leave }]);
  const billOf = () => Object.keys(q).reduce((s, k) => s + q[k] * pr[k], 0);
  const refresh = () => {
    const total = billOf();
    $('#bill').textContent = money(total);
    const over = total > S.money + 1e-9;
    $('#storewarn').textContent = over ? "You can't afford all that." : '';
    const btn = choicesEl.querySelector('button'); if (btn) btn.disabled = over;
    rows.forEach(([k]) => { const el = $('#q-' + k); if (el && document.activeElement !== el) el.value = q[k]; });
  };
  textEl.querySelectorAll('.step button').forEach(b => b.addEventListener('click', () => { const k = b.dataset.k; q[k] = clamp(q[k] + Number(b.dataset.d), 0, k === 'letter' ? 1 : 9999); sfx.tap(); refresh(); }));
  rows.forEach(([k]) => { const el = $('#q-' + k); el.addEventListener('input', () => { const v = Math.floor(Number(el.value)); q[k] = clamp(isFinite(v) ? v : 0, 0, k === 'letter' ? 1 : 9999); refresh(); }); el.addEventListener('blur', refresh); });
  refresh();
}

/* ---------- travel ---------- */
function departTabriz() {

function hudLine() { const a = alive().length; return `<span><b>${shortDate(S.day)},</b> 1404</span><span>${S.army ? 'marching with the army' : PACES[S.pace] + ' pace'}</span><span>${plural(a, 'traveler')}</span>`; }
function remainingEst() { let id = S.segFrom, rem = 0, first = true, n = 0; while (id !== 'samarkand' && n++ < 40) { const e = edgeOf(id); if (!e) break; rem += first && !S.atNode ? e.len - S.segDone : e.len; first = false; id = e.to; } return Math.max(0, rem); }
function statusHTML() {

    <dt class="sr">Progress</dt><dd class="prog"><span>Tabriz</span><span class="bar"><i style="width:${pct}%"></i></span><span>Samarkand</span></dd></dl>`;
}
function travelScreen() {
  if (!leader().alive) return gameOver();

function hearts(hp) { const n = clamp(Math.ceil(hp / 20), 0, 5); return `<span class="hearts" role="img" aria-label="${healthLabel(hp)} health">${'♥'.repeat(n)}<span class="o">${'♥'.repeat(5 - n)}</span></span>`; }

    <dt>Packsaddles</dt><dd>${S.saddles} spare</dd><dt>Water skins</dt><dd>${S.skins} (${S.water.toFixed(1)} full)</dd><dt>Travel letter</dt><dd>${S.letter ? 'yes' : 'no'}</dd>

const GOODS = { food: ['pound of food', 'pounds of food', 0.15], coats: ['felt coat', 'felt coats', 10], arrows: ['arrow', 'arrows', 0.1], camels: ['camel', 'camels', 40], saddles: ['spare packsaddle', 'spare packsaddles', 10], skins: ['water skin', 'water skins', 4] };
const gq = (k, n) => `${n} ${n === 1 ? GOODS[k][0] : GOODS[k][1]}`;
function makeOffer() {
  const keys = Object.keys(GOODS);
  for (let tries = 0; tries < 30; tries++) {
    const want = pick(keys), give = pick(keys);
    if (want === give || S[want] <= 0) continue;
    let wq = want === 'food' ? ri(3, 10) * 10 : want === 'arrows' ? ri(1, 3) * 20 : ri(1, want === 'camels' ? 1 : 3);
    if (want === 'camels' && S.camels <= 1) continue;
    wq = Math.min(wq, Math.floor(S[want])); if (wq <= 0) continue;
    const val = wq * GOODS[want][2] * rnd(0.75, 1.3);
    let n = Math.max(1, Math.round(val / GOODS[give][2]));
    if (give === 'food' || give === 'arrows') n = Math.max(10, Math.round(n / 10) * 10);
    if (give === 'camels' && n > 2) continue;
    return { want, wq, give, gq: n, who: pick(TRADERS) };
  }

}

/* ---------- rivers ---------- */
function riverArrive(id) {
  const rv = N[id].river; const m = monthOf(S.day);
  S.river = { id, depth: Math.max(0.5, rv.depth[m] + rnd(-0.4, 0.4)), width: ri(rv.width[0], rv.width[1]), localIdx: 0 };
  setScene('river', { node: id });
  screen(`<p class="date">${dateStr(S.day)}</p><h2>${esc(placeName(id))}</h2><p>${N[id].look}</p>`, [{ label: 'Continue', primary: true, onClick: () => riverScreen(id) }]);
}
function riverScreen(id) {
  const nd = N[id], rs = S.river, rv = nd.river;

}
function raftDraw() {
  if (!raft) return;
  const n = raft.night, t = scene.t;
  const bank = n ? '#3B3577' : '#FFE0A8', bankE = n ? '#2C2860' : '#F2C882', wat = n ? '#1E2A6E' : P.water, str = n ? '#33479A' : P.waterL;
  R(bank, 0, 0, 20, H); R(bank, 220, 0, 20, H); R(bankE, 18, 0, 2, H); R(bankE, 220, 0, 2, H);
  const off = raft.t * 44;
  for (let y = -10; y < H + 10; y += 9) { const yy = ((y + off) % (H + 18)) - 9; R(n ? '#4A5A3A' : P.leaf, 4 + (hash(y) * 10 | 0), yy, 1, 4); px(n ? '#5E6E4A' : P.leafL, 5 + (hash(y) * 10 | 0), yy); R(n ? '#4A5A3A' : P.leaf, 226 + (hash(y + 7) * 10 | 0), yy, 1, 4); }
  R(wat, 20, 0, 200, H);
  for (let i = 0; i < 60; i++) { const x = 22 + hash(i) * 194, y = ((hash(i + 40) * (H + 12)) + off) % (H + 12) - 6; R(i % 7 ? str : (n ? '#5A6FC0' : P.white), x, y, 1, 4); }
  if (n) { disc(150, 12, 5, '#FFF3C4'); disc(152, 10, 5, wat); for (let y = 0; y < H; y += 3) { const w = 4 + Math.round(Math.sin(y * 0.3 + t * 3) * 2); R('#FFF3C4', 150 - w / 2 + Math.sin(y * 0.15 + t) * 3, y, w, 1); } }
  for (const o of raft.obs) {

    else if (o.kind === 'snag') { R(P.woodD, o.x, o.y, o.w, 3); R(P.woodD, o.x + 3, o.y - 2, 1, 2); R(P.woodD, o.x + o.w - 4, o.y + 3, 1, 2); px(P.leaf, o.x + 4, o.y - 2); }
    else if (o.kind === 'sandbar') { R('#FFE7BD', o.x, o.y, o.w, o.h); R('#FFF3DA', o.x + 3, o.y + 1, o.w - 6, 2); px(P.leaf, o.x + 5, o.y + 3); }
    else if (o.kind === 'whirl') { for (let k = 0; k < 10; k++) { const a = k / 10 * Math.PI * 2 + t * 6, rr = 2 + k * 0.35; px(P.white, o.x + 5 + Math.cos(a) * rr, o.y + 4 + Math.sin(a) * rr * 0.7); } }
    else if (o.kind === 'lantern') { g.save(); g.globalAlpha = 0.28; disc(o.x + o.w / 2, o.y + 3, 16, P.yellow); g.globalAlpha = 0.35; disc(o.x + o.w / 2, o.y + 3, 9, '#FFF3A6'); g.restore(); R(P.wood, o.x, o.y + 3, o.w, 5); R(P.woodD, o.x, o.y + 7, o.w, 1); R(P.yellow, o.x + o.w / 2 - 1, o.y, 2, 3); drawPerson(o.x + 3, o.y - 8, 0, { robe: P.coral, trim: P.white, hat: 'kalpak', skin: 2 }, { arms: false }); }
  }
  const rx = Math.round(raft.x), ry = 104 + (raft.stuck > 0 ? 0 : Math.round(Math.sin(t * 6)));
  R(str, rx - 2, ry + 11, 18, 1);
  for (let k = 0; k < Math.min(3, S ? S.camels : 2); k++) { const cx = rx + 1 + k * 5, cy = ry + 14 + (k % 2); R(P.camel, cx, cy, 3, 2); px(P.navy, cx + 2, cy); px(P.camelD, cx, cy - 1); R(str, cx - 1, cy + 2, 5, 1); }
  for (const [sx, sy] of [[0, 0], [10, 0], [0, 6], [10, 6]]) { R(P.white, rx + sx, ry + sy, 4, 4); px(P.lavL, rx + sx + 3, ry + sy + 3); }
  R(P.wood, rx + 1, ry + 2, 12, 6); R(P.woodD, rx + 1, ry + 4, 12, 1);
  R(CLOTHS[0][0], rx + 2, ry + 3, 3, 3); R(CLOTHS[1][0], rx + 9, ry + 5, 3, 2);
  R(SKIN[1], rx + 6, ry - 2, 3, 3); R(P.white, rx + 6, ry - 3, 3, 1); px(P.navy, rx + 6, ry - 1); px(P.navy, rx + 8, ry - 1); R(LOOKS[0].robe, rx + 6, ry + 1, 3, 2);
  R(P.white, rx + 10, ry + 1, 3, 2); px(P.white, rx + 12, ry); px(P.navy, rx + 12, ry); px(P.lavD, rx + 11, ry - 1);
  if (raft.cool > 0 && Math.floor(t * 12) % 2) { g.save(); g.globalAlpha = 0.45; R(P.white, rx - 1, ry - 3, 16, 14); g.restore(); }
}
function raftEnd() {
  if (!raft || raft.over) return; raft.over = true;
  const rs = raft.results.slice(); const caught = raft.caught; const done = raft.onDone; raft = null; setHud(null);
  const items = [];
  if (!caught) items.push(msg(rs.length ? 'You reach the far bank, wet and a little lighter.' : 'You reach the far bank without a scratch! A camel paddles up a minute later, having made its own arrangements.', { scene: { mode: 'walk' }, sound: rs.length ? undefined : 'good' }));
  rs.forEach(r => items.push(typeof r === 'string' ? msg(r) : r));

/* ---------- deaths & endings ---------- */
function deathText(m, cause) { if (cause === 'drowned') return m.leader ? 'You have drowned.' : `${esc(m.name)} has drowned.`; return `${m.leader ? 'You have' : esc(m.name) + ' has'} died of ${cause}.`; }
function deathScreen(m, cause, next) {
  travelling = false; setScene('grave');
  sfx.death();
  const isLeader = m.leader;
  screen(`<p class="date">${dateStr(S.day)}</p><p class="big">${deathText(m, cause)}</p><div class="tomb"><div class="rip">R · I · P</div><p class="here">Here lies ${esc(m.name)}</p><p class="epi" id="epiShow" aria-hidden="true">&nbsp;</p></div><p class="dim small">Carve an epitaph? The next caravan down this road might read it.</p><input class="txt" id="epi" maxlength="40" autocomplete="off" aria-label="Epitaph" placeholder="${esc(pick(['Gone too soon.', 'Loved melons.', 'Should have boiled the water.', 'Walked to the end of it.', 'Never trusted the goat.']))}">`,
    [{ label: 'Rest in peace', primary: true, onClick: () => {
      const epitaph = ($('#epi').value || '').trim().slice(0, 40);
      const graves = store.get(KEY.graves, null) || SEED_GRAVES.slice();
      graves.push({ id: S.run + '-' + m.name + '-' + S.day, run: S.run, seg: segKey() || (S.segFrom + '>'), at: Math.max(0.5, S.segDone), name: m.name, epitaph });
      store.set(KEY.graves, graves.slice(-40));
      save();
      if (isLeader) return gameOver(epitaph);
      next();
    } }], { focus: false });
  const inp = $('#epi'), show = $('#epiShow');
  if (inp && show) inp.addEventListener('input', () => { show.textContent = inp.value.trim() || ' '; });
}
function gameOver(epitaph) {
  travelling = false; setScene('grave');
  const others = alive().length;
  store.del(KEY.save);
  setTimeout(() => { if (scene.mode === 'grave') emote('goat', 'note', 2.4); }, 1400);
  screen(`<div class="tomb"><div class="rip">R · I · P</div><p class="here">Here lies ${esc(leader().name)}</p>${epitaph ? `<p class="epi">${esc(epitaph)}</p>` : ''}</div><p class="big">${others ? `${others === 1 ? 'The last of your party turns' : 'The rest of your party turn'} back toward Tabriz.` : 'Everyone in your party has died.'}</p><p class="big">The goat is fine.</p>`,
    [{ label: 'Try again', primary: true, onClick: titleScreen }, { label: 'See the Top Ten', onClick: () => topTenScreen() }]);
}
function arrivalSamarkand() {
  travelling = false;
  const early = S.day < FEAST_START, late = S.day > FEAST_END;
  setScene('arrive', { late });
  if (!late) sfx.fanfare(); else sfx.bad();

  if (late) { head = 'You made it… a little late.'; text = 'Timur has already left to invade China. The feast is over. On the empty meadow, a man with a broom hands you a cold samsa.'; }
  else if (early) { head = 'You made it, and you’re early!'; text = 'The whole city is getting ready for something. Workers hang silk on anything that holds still. You rent a room by the bazaar, eat an unreasonable number of apricots and wait. In September the ambassadors arrive, and the feasting begins.'; }
  else { head = 'You made it, just in time for the feast!'; text = 'Out on the meadows beyond the walls, Timur’s great feast is in full swing. There are elephants. There is a giraffe. Cartloads of roast meat arrive every hour. Ambassadors have come from Spain, Egypt and China, and Timur has seated the Chinese below the Spanish, which is all anyone can talk about.'; }
  screen(`<p class="date">${dateStr(S.day)}</p><h1 style="font-size:clamp(40px,11vw,58px)">Samarkand!</h1><p class="big">${head}</p><p>${text}</p>`, [{ label: 'Continue', primary: true, onClick: () => late ? scoreScreen(false) : dazzleScreen() }]);
}
function dazzleScreen() {
  setScene('arrive', { late: false });
  sfx.sparkle();
  screen(`<h2>The center of the world</h2><p>Then you just stand there and look.</p><p>Turquoise domes blaze against the sky. There are rose gardens and melon stalls, silk from China, glass from Damascus, painters from Tabriz and stonecutters from Delhi. Plenty of those craftsmen didn’t come by choice. Timur’s armies carried them off from their own cities, and now they’re building his.</p><p class="big">It is the most beautiful thing you have ever seen.</p>`,
    [{ label: 'See your score', primary: true, onClick: () => scoreScreen(true) }]);
}
function scoreScreen(feast) {

}
function resumeScreen() {
  if (S.atNode) {

    if (nd.kind === 'river' && S.river) return riverScreen(S.segFrom);

/* ---------- input ---------- */
function toV(ev) { const r = cv.getBoundingClientRect(); return { x: (ev.clientX - r.left) / r.width * W, y: (ev.clientY - r.top) / r.height * H }; }
cv.addEventListener('pointerdown', ev => {
  if (scene.mode === 'hunt') { ev.preventDefault(); huntShoot(toV(ev)); }
  else if (scene.mode === 'raft' && raft) { ev.preventDefault(); raft.steer = toV(ev).x; try { cv.setPointerCapture(ev.pointerId); } catch (e) {} }
  else if (S && ['walk', 'node', 'river', 'store', 'grave'].includes(scene.mode)) {
    const p = toV(ev); let best = null, bd = 14;
    for (const [k, a] of Object.entries(ANCH)) { if (!/^(p\d|goat|c\d)$/.test(k)) continue; const d = Math.hypot(a[0] - p.x, a[1] + 6 - p.y); if (d < bd) { bd = d; best = k; } }
    if (best) emote(best, best === 'goat' ? pick(['heart', '!', '?', 'melon']) : best[0] === 'c' ? pick(['z', 'heart', '?']) : pick(['heart', 'note', 'sparkle', '?']));
  }
});

['pointerup', 'pointercancel'].forEach(t => cv.addEventListener(t, () => { if (raft) raft.steer = null; }));
document.addEventListener('keydown', ev => {
  if (scene.mode === 'raft') { if (ev.key === 'ArrowLeft' || ev.key === 'a') { keys.left = true; ev.preventDefault(); } if (ev.key === 'ArrowRight' || ev.key === 'd') { keys.right = true; ev.preventDefault(); } }

    return;
  }
  if (/^[1-9]$/.test(ev.key)) { const b = choicesEl.querySelector(`button[data-key="${ev.key}"]`); if (b && !b.disabled) { ev.preventDefault(); b.click(); } return; }
  if ((ev.key === 'Enter' || ev.key === ' ') && tag !== 'BUTTON') { const b = choicesEl.querySelector('button.primary') || (choicesEl.children.length === 1 ? choicesEl.querySelector('button') : null); if (b && !b.disabled) { ev.preventDefault(); b.click(); } }
});

const musBtn = $('#musBtn'), sfxBtn = $('#sfxBtn');
function syncToggles() {
  musBtn.setAttribute('aria-pressed', String(SND.musicOn)); musBtn.title = SND.musicOn ? 'Music is on' : 'Music is off';
  sfxBtn.setAttribute('aria-pressed', String(SND.fxOn)); sfxBtn.title = SND.fxOn ? 'Sound effects are on' : 'Sound effects are off';
}
musBtn.addEventListener('click', ev => { ev.stopPropagation(); SND.unlock(); SND.setMusic(!SND.musicOn); syncToggles(); });
sfxBtn.addEventListener('click', ev => { ev.stopPropagation(); SND.unlock(); SND.setFx(!SND.fxOn); syncToggles(); if (SND.fxOn) sfx.coin(); });
['pointerdown', 'touchend', 'click', 'keydown'].forEach(t => document.addEventListener(t, () => SND.unlock(), { capture: true, passive: true }));
syncToggles();

/* ---------- boot ---------- */
window.__trail = { state: () => S, setDay: ms => { DAY_MS = ms; }, scene: () => scene, hunt: () => hunt, raft: () => raft, huntEnd, raftEnd, jump: id => { travelling = false; arriveAt(id); }, raftTest: night => raftGame({ night, onDone: items => crossDone(items) }), talk: () => talkScreen(), emote, store: () => storeScreen(S.segFrom, menuScreen), dazzle: () => dazzleScreen(), score: f => scoreScreen(f), cue: n => { forcedCue = n; }, snd: SND };
function start(data) {
  if (data && data.S && data.S.v === 1) { S = data.S; }
  titleScreen();
  requestAnimationFrame(loop);
}
try { if (window.claude && window.claude.hot && typeof window.claude.hot.snapshot === 'function') window.claude.hot.snapshot(() => ({ S })); } catch (e) {}
if (window.claude && window.claude.hot && typeof window.claude.hot.ready === 'function') window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
