/* ---------- v4: more history, travelers and Timur ---------- */
N.sultaniyya.hist += ' A century earlier, Marco Polo came through Tabriz, where your trip began, and called it a great city where merchants came from India, Baghdad, Mosul and Hormuz, and where Latin merchants bought goods from strange lands.';
N.ordu.hist += ' Timur’s wars were some of the bloodiest in history. After Isfahan rebelled in 1387, each of his soldiers had to bring in a quota of heads. Chroniclers counted about seventy thousand, piled into towers outside the walls. Before the battle for Delhi in 1398, he had perhaps a hundred thousand prisoners killed in a single day, so they could not rise up behind his army. At Baghdad in 1401, each soldier owed him two heads, and there were a hundred and twenty towers. Some historians guess his wars killed seventeen million people, about one in every twenty people alive.';
N.damghan.hist += ' Timur built towers like these all over his empire. They were cruel, and they were also advertising: every merchant who passed them carried the story on to the next town.';
N.nishapur.hist += ' A century later the traveler Ibn Battuta, from Morocco, found Nishapur rebuilt and lovely, full of orchards and streams, and called it Little Damascus. He bought silk and velvet here to send home.';
N.balkh.hist += ' Marco Polo passed by around 1273 and wrote that Balkh had once been a noble city of marble palaces, all ruined by the Tartars. Ibn Battuta came sixty years later and found it still empty: a city of ruins, with nobody living in it.';
N.merv.hist += ' Just before the end, the geographer Yaqut spent three happy years in Merv’s ten great libraries, where he could borrow two hundred books at a time without paying a deposit. He escaped the Mongols with his notes and spent the rest of his life missing it.';
N.bukhara.hist += ' When Ibn Battuta visited in 1333, most of its mosques, colleges and markets were still in ruins from the Mongols, and he complained that nobody left there knew anything about learning.';
N.kesh.hist += ' Arrow wounds left him lame in his right leg and arm, so the Persians called him Timur-i Lang, Timur the Lame, which Europeans turned into Tamerlane. He probably could not read, but he loved history and chess, and outside burning Damascus in 1401 he spent weeks arguing with the great historian Ibn Khaldun, who found him fascinating and terrifying in about equal parts. Clavijo, the Castilian ambassador, saw this palace in 1404 and said its tilework was the finest in the world.';
N.kesh.legend = 'People say that when Timur took Shiraz, he sent for the poet Hafez. “I have conquered half the world to make Samarkand and Bukhara beautiful,” he said, “and you would give them both away for a mole on a girl’s cheek?” Hafez bowed and showed him his ragged robe. “Sire, it is because of generosity like that that I am now so poor.” Timur laughed and gave him a robe of honor. It probably never happened. Everyone tells it anyway.';
const OXUS_NOTE = 'This is the Oxus, the river the Persians call the Jayhun and the Turks the Amu. For a thousand years it has been the line between Iran and Turan, between the Persian world and the Turkish one. Everything on the far side, the Arabs simply call Mawarannahr: what lies beyond the river. Timur’s officers watch every ferry.';
const SAMARKAND_HIST = 'Samarkand is older than Rome. Alexander the Great took it in 329 BC, when it was called Marakanda, and is said to have found it even more beautiful than he had heard. Chinese prisoners taught it to make paper in 751. Genghis Khan wrecked it in 1220. Ibn Battuta came through in 1333 and still called it one of the greatest and most beautiful cities in the world, with orchards along the river and its old palaces in ruins.<br><br>Then Timur made it his capital and filled it with the riches and the people of half of Asia. He named the villages around it Baghdad, Damascus, Cairo, Shiraz and Sultaniyya, after cities he had beaten, so everyone would know which was greatest. The price of all this beauty was paid in towers of skulls: seventy thousand heads at Isfahan, a hundred thousand prisoners killed outside Delhi, a hundred and twenty towers at Baghdad. Weavers from Damascus, stonecutters from Delhi and tile makers from Tabriz were marched here to build it.<br><br>A few months after the feast, Timur set out to conquer China. He died on the way, in February 1405, in the snow at Otrar. His blue-ribbed tomb, the Gur-i Amir, still stands in Samarkand.';
